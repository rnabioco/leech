# SLURM Cluster Profile for Leech Pipeline (Alpine Cluster)
# ===========================================================
# Configured for CU Boulder Alpine cluster
# https://curc.readthedocs.io/en/latest/clusters/alpine/
# Updated for Snakemake 9+ executor plugin system

# Use SLURM executor plugin
executor: slurm

# SLURM-specific settings
slurm-qos: "normal"

# Job submission settings
jobs: 100
max-jobs-per-second: 10
latency-wait: 60

# Rerun settings
restart-times: 3

# Default resources for rules without explicit resources
default-resources:
  - slurm_partition="amilan"
  - ntasks=1
  - mem_mb=8000
  - runtime=120
  - account=""
  - slurm_extra=""

# Resource mapping from Snakemake resources to SLURM directives
# Alpine-specific settings:
# - GPU partitions: aa100 (NVIDIA A100), ami100 (AMD MI100)
# - Testing partitions: atesting_a100, atesting_mi100 (for short test jobs)
# - CPU partition: amilan (default, no GPUs)
# - QoS: normal, long (>24h)
set-resources:
  # Rebasecall rule needs GPU partition
  - rebasecall:slurm_partition="aa100"
  - rebasecall:ntasks=1
  - rebasecall:gpu=1
  - rebasecall:nodes=1
  - rebasecall:cpus_per_gpu=4
  # Grid search rules need more time and GPU (use A100 partition)
  - grid_search_charged_vs_uncharged:runtime=1440
  - grid_search_charged_vs_uncharged:gpu=1
  - grid_search_charged_vs_uncharged:mem_mb=16000
  - grid_search_charged_vs_uncharged:partition="aa100"
  - grid_search_charged_vs_uncharged:qos="normal"
  - grid_search_charged_vs_uncharged:ntasks=42

  - grid_search_pairwise_aa:runtime=1440
  - grid_search_pairwise_aa:gpu=1
  - grid_search_pairwise_aa:mem_mb=16000
  - grid_search_pairwise_aa:partition="aa100"
  - grid_search_pairwise_aa:qos="normal"
  - grid_search_pairwise_aa:ntasks=42

  # Training rules (use A100 partition)
  - train_charged_vs_uncharged:runtime=480
  - train_charged_vs_uncharged:gpu=1
  - train_charged_vs_uncharged:mem_mb=16000
  - train_charged_vs_uncharged:partition="aa100"
  - train_charged_vs_uncharged:qos="normal"
  - train_charged_vs_uncharged:ntasks=42

  - train_pairwise_aa:runtime=480
  - train_pairwise_aa:gpu=1
  - train_pairwise_aa:mem_mb=16000
  - train_pairwise_aa:partition="aa100"
  - train_pairwise_aa:qos="normal"
  - train_pairwise_aa:ntasks=42

  # Inference rules (use A100 partition)
  - infer_charged_vs_uncharged:runtime=240
  - infer_charged_vs_uncharged:gpu=1
  - infer_charged_vs_uncharged:mem_mb=8000
  - infer_charged_vs_uncharged:partition="aa100"
  - infer_charged_vs_uncharged:qos="normal"
  - infer_charged_vs_uncharged:ntasks=42

  - infer_pairwise_aa:runtime=240
  - infer_pairwise_aa:gpu=1
  - infer_pairwise_aa:mem_mb=8000
  - infer_pairwise_aa:partition="aa100"
  - infer_pairwise_aa:qos="normal"
  - infer_pairwise_aa:ntasks=42

  # Test/evaluation rules (use testing partition for short jobs)
  - test_charged_vs_uncharged:runtime=60
  - test_charged_vs_uncharged:gpu=1
  - test_charged_vs_uncharged:mem_mb=4000
  - test_charged_vs_uncharged:partition="atesting_a100"
  - test_charged_vs_uncharged:qos="testing"
  - test_charged_vs_uncharged:ntasks=42

  - test_pairwise_aa:runtime=60
  - test_pairwise_aa:gpu=1
  - test_pairwise_aa:mem_mb=4000
  - test_pairwise_aa:partition="atesting_a100"
  - test_pairwise_aa:qos="testing"
  - test_pairwise_aa:ntasks=42
