[project]
name = "leech"
version = "0.1.0-alpha"
description = "Learning Enhanced Aminoacylation Classification from Hanopore signals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "aa-tRNA-seq pipeline team" }]
keywords = [
  "aminoacylation",
  "bioinformatics",
  "machine-learning",
  "nanopore",
  "tRNA"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "click>=8.1.0",
  "numpy>=2.0.0",
  "nvitop>=1.6.1",
  "pod5>=0.3.0",
  "pysam>=0.22.0",
  "rich>=13.0.0",
  "rich-click>=1.7.0",
  "scikit-learn>=1.5.0",
  "snakefmt>=0.10.3",
  "snakemake>=9.0.0",
  "snakemake-executor-plugin-lsf>=0.2.5",
  "snakemake-executor-plugin-slurm>=1.9.2",
  "torch>=2.5.0",
]

[project.scripts]
leech = "leech.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",  # Modern linter/formatter (replaces black + flake8)
  "mypy>=1.8.0",
  "nbqa>=1.7.0",  # Quality assurance for Jupyter notebooks
]
notebook = [
  "polars>=1.0.0",
  "plotnine>=0.13.0",
  "great_tables>=0.14.0",
  "seaborn>=0.13.0",
  "statsmodels>=0.14.0",
  "tabulate>=0.9.0",
]

[dependency-groups]
docs = [
  "matplotlib>=3.10.7",
  "mkdocs>=1.6.1",
  "mkdocs-autorefs>=1.4.3",
  "mkdocs-material>=9.7.0",
  "mkdocstrings[python]>=0.30.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leech"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.nbqa.addopts]
ruff = ["--ignore=E402"]

[tool.pytest.ini_options]
addopts = "-v --cov=leech --cov-report=term-missing"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # Allow imports anywhere in notebooks

[tool.ruff.lint.isort]
known-first-party = ["leech"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
# Ignore PyTorch nn.Module attribute assignment false positives
# PyTorch uses custom __setattr__ which ty doesn't understand
unresolved-attribute = "ignore"
unresolved-import = "ignore"
# Ignore false positives from PyTorch Dataset iteration and numpy arrays
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"
