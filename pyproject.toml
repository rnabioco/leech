[project]
name = "leech"
version = "0.9.0"
description = "Learning Enhanced Electrical Classifiers from Hanopore signals"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aa-tRNA-seq pipeline team" }]
keywords = [
  "aminoacylation",
  "bioinformatics",
  "machine-learning",
  "nanopore",
  "tRNA"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "click>=8.1.0",
  # POD5 I/O and signal normalization. Imported unconditionally by
  # leech.io.pod5_reader and leech.features, so it cannot be optional.
  "escapepod>=0.16.0",
  "numpy>=2.0.0",
  "nvitop>=1.6.1",
  "polars>=1.43.2",
  "pysam>=0.22.0",
  # Release specs (release/spec.py) and `--confound-config x.yaml` + YAML
  # lookup tables (confounds.py). Both import it lazily so it stays off the
  # CLI startup path, but both are shipped features, so it is a runtime
  # dependency -- it previously resolved only by accident, transitively via
  # snakemake in the `pipeline` extra.
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "rich-click>=1.7.0",
  "scikit-learn>=1.5.0",
  "torch>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/rnabioco/leech"
Repository = "https://github.com/rnabioco/leech"
Documentation = "https://rnabioco.github.io/leech/"
Changelog = "https://github.com/rnabioco/leech/blob/main/CHANGELOG.md"
Issues = "https://github.com/rnabioco/leech/issues"

[project.scripts]
leech = "leech.cli:main"
check-rust = "leech._rust_accel:check_rust"

[project.optional-dependencies]
# Pinned, not floating. `leech` and `leech-core` are built from one repo and
# released in lockstep, and `check_rust()` only *warns* on a mismatch -- an
# unpinned extra lets pip pair a current `leech` with a stale `leech-core`,
# which is the hazard tests/test_rust_version_pairing.py exists to prevent.
# Bump with the other two version strings; the test enforces all three agree.
rust = ["leech-core==0.9.0"]
# Retained as a no-op alias: escapepod is now a required dependency, but
# `--extra pod5` appears in existing docs, CI, and user scripts.
pod5 = []
# ONNX export (`leech model export --format onnx`, `leech.crf.export`).
# Optional because torch alone can export the graph -- it is the round-trip
# VERIFY, which compares onnxruntime against torch across the serialization
# boundary, that needs these. That check is what catches what an in-process
# assert cannot, so the extra is worth having rather than skipping the step.
onnx = [
  "onnx>=1.17.0",
  "onnxruntime>=1.20.0",
  "onnxscript>=0.1.0",  # required by torch.onnx.export(dynamo=True)
]
# Minimal deps to run the test suite (used by CI's test job).
test = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
]
# Full local dev env: test runners + lint/type/QA tooling.
dev = [
  "leech[test]",
  "leech[onnx]",
  "ruff>=0.16.1",  # Modern linter/formatter (replaces black + flake8)
  "ty>=0.0.66",
  "ruff>=0.16.1",  # Modern linter/formatter (replaces black + flake8)
  "ty>=0.0.64",
  "nbqa>=1.7.0",  # Quality assurance for Jupyter notebooks
  "vulture>=2.15",  # Dead code detection
]
pipeline = [
  "snakefmt>=0.10.3",
  "snakemake>=9.24.0",
  "snakemake-executor-plugin-lsf>=0.2.5",
  "snakemake-executor-plugin-slurm>=1.9.2",
]
notebook = [
  "plotnine>=0.13.0",
  "great_tables>=0.23.0",
  "statsmodels>=0.14.6",
  "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "pymupdf>=1.27.1",
]
docs = [
  "matplotlib>=3.10.7",
  "mkdocstrings[python]>=1.0.6",
  "zensical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leech"]
artifacts = ["src/leech/data/*.txt", "src/leech/data/*.txt.gz", "src/leech/py.typed"]

[tool.nbqa.addopts]
ruff = ["--ignore=E402"]

[tool.pytest.ini_options]
addopts = "-v"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]
markers = ["slow: slow tests (torch.export, bundles) — run with --slow"]

[tool.uv]
# plotnine pins statsmodels<=0.14.4 on emscripten (pyodide), which conflicts
# with the notebook extra's statsmodels>=0.14.6 and makes the lock
# unresolvable. leech never targets wasm, so exclude it from resolution.
environments = ["sys_platform != 'emscripten'"]

[tool.uv.workspace]
members = ["rust"]

[tool.uv.sources]
leech-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = ["*.ipynb"]
# ruff 0.16 formats Python code blocks inside Markdown. Left on, it rewrites
# doc examples to fit the formatter rather than to read well -- it collapses the
# idiomatic multi-line plotnine chain in CLAUDE.md onto one 103-char line, and
# strips the aligned comment columns from the training-chunk dict. Prose examples
# are hand-formatted on purpose, so keep .md out of both format and check.
# Note: these must be extend-exclude, not exclude -- CI passes `--exclude
# vulture_whitelist.py`, and a CLI --exclude replaces `exclude` entirely.
extend-exclude = ["vulture_whitelist.py", "*.md"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # Allow imports anywhere in notebooks
"__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["leech"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
# Ignore PyTorch nn.Module attribute assignment false positives
# PyTorch uses custom __setattr__ which ty doesn't understand
unresolved-attribute = "ignore"
unresolved-import = "ignore"
# Ignore false positives from PyTorch Dataset iteration and numpy arrays
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"
# Union function call narrowing false positives (signal_refine.py core_func dispatch)
too-many-positional-arguments = "ignore"
missing-argument = "ignore"
# pysam get_tag returns object; ty can't narrow to indexable
call-non-callable = "ignore"
# Stale `ty: ignore` comments that newer ty no longer needs. The rule was
# renamed unused-type-ignore-comment -> unused-ignore-comment; keep both so
# the pinned dev ty and CI's `uvx ty` (latest) both honor it.
unused-type-ignore-comment = "ignore"
unused-ignore-comment = "ignore"

[tool.vulture]
min_confidence = 80
paths = ["src/", "vulture_whitelist.py"]
ignore_names = ["test_*", "setUp", "tearDown"]
ignore_decorators = ["@app.route", "@click.command", "@pytest.fixture"]
