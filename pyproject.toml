[project]
name = "leech"
version = "0.1.0"
description = "Learning Enhanced Aminoacylation Classification from Hanopore signals"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "aa-tRNA-seq pipeline team"}
]
keywords = ["nanopore", "machine-learning", "bioinformatics", "tRNA", "aminoacylation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.5.0",
    "numpy>=2.0.0",
    "pysam>=0.22.0",
    "pod5>=0.3.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.5.0",
    "snakefmt>=0.10.3",
    "snakemake>=9.0.0",
    "snakemake-executor-plugin-slurm>=1.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",  # Modern linter/formatter (replaces black + flake8)
    "mypy>=1.8.0",
]

[project.scripts]
leech = "leech.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leech"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["leech"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=leech --cov-report=term-missing"
