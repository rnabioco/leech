[project]
name = "leech"
version = "0.3.2"
description = "Learning Enhanced Electrical Classifiers from Hanopore signals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "aa-tRNA-seq pipeline team" }]
keywords = ["aminoacylation", "bioinformatics", "machine-learning", "nanopore", "tRNA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "click>=8.1.0",
  "escapepod",
  "numpy>=2.0.0",
  "nvitop>=1.6.1",
  "polars>=1.0.0",
  "pysam>=0.22.0",
  "rich>=13.0.0",
  "rich-click>=1.7.0",
  "scikit-learn>=1.5.0",
  "torch>=2.5.0",
]

[project.scripts]
check-rust = "leech._rust_accel:check_rust"
leech = "leech.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.3.0",  # Modern linter/formatter (replaces black + flake8)
  "ty>=0.0.1a10",
  "nbqa>=1.7.0",  # Quality assurance for Jupyter notebooks
  "vulture>=2.15",  # Dead code detection
]
notebook = [
  "plotnine>=0.13.0",
  "great_tables>=0.14.0",
  "statsmodels>=0.14.0",
  "tabulate>=0.9.0",
]
pipeline = [
  "snakefmt>=0.10.3",
  "snakemake>=9.0.0",
  "snakemake-executor-plugin-lsf>=0.2.5",
  "snakemake-executor-plugin-slurm>=1.9.2",
]

[dependency-groups]
dev = [
  "maturin>=1.12.6",
  "pymupdf>=1.27.1",
]
docs = [
  "ghp-import",
  "matplotlib>=3.10.7",
  "mkdocstrings[python]>=0.30.1",
  "zensical",
]

[build-system]
requires = ["maturin>=1.12.6"]
build-backend = "maturin"

# leech is a mixed Rust/Python project. maturin compiles the Rust crate in
# rust/ (the `leech_core` acceleration extension) and bundles it into the leech
# wheel alongside the pure-Python package in src/leech — a single `uv add leech`
# (or pip install) gets both. The Rust crate links escapepod-signal from the
# escapepod-rs submodule at build time, so building from source requires that
# (private) submodule; published platform wheels carry the compiled extension
# and need no Rust toolchain or submodule access.
[tool.maturin]
features = ["pyo3/extension-module"]
include = [
  "src/leech/data/*.txt",
  "src/leech/data/*.txt.gz",
  "src/leech/py.typed",
]
manifest-path = "rust/Cargo.toml"
module-name = "leech._leech_core"
python-source = "src"

[tool.nbqa.addopts]
ruff = ["--ignore=E402"]

[tool.pytest.ini_options]
addopts = "-v"
markers = ["slow: slow tests (torch.export, bundles) — run with --slow"]
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = ["*.ipynb"]
extend-exclude = ["escapepod-rs", "vulture_whitelist.py"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # Allow imports anywhere in notebooks
"__init__.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["leech"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.rules]
# Ignore PyTorch nn.Module attribute assignment false positives
# PyTorch uses custom __setattr__ which ty doesn't understand
unresolved-attribute = "ignore"
unresolved-import = "ignore"
# Ignore false positives from PyTorch Dataset iteration and numpy arrays
possibly-missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
no-matching-overload = "ignore"
# Union function call narrowing false positives (signal_refine.py core_func dispatch)
too-many-positional-arguments = "ignore"
missing-argument = "ignore"
# pysam get_tag returns object; ty can't narrow to indexable
call-non-callable = "ignore"
# Stale type: ignore comments that newer ty no longer needs
unused-type-ignore-comment = "ignore"

# For local development, resolve escapepod from the submodule via the uv
# workspace. On PyPI this source override is ignored and escapepod resolves
# from its published wheels. leech_core is no longer a separate package — it is
# compiled into the leech wheel by maturin (see [tool.maturin]).
[tool.uv.workspace]
members = ["escapepod-rs/crates/escapepod-python"]

[tool.uv.sources]
escapepod = { workspace = true }

[tool.vulture]
min_confidence = 80
paths = ["src/"]
ignore_names = ["test_*", "setUp", "tearDown"]
ignore_decorators = ["@app.route", "@click.command", "@pytest.fixture"]
