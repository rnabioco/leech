name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/leech/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for git info
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive  # escapepod-rs provides the `escapepod` workspace member

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      # leech imports escapepod (built from the escapepod-rs submodule via
      # maturin), so caching target/ turns a multi-minute compile into seconds.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            escapepod-rs

      - name: Install dependencies
        env:
          # CPU-only torch so we don't pull the multi-GB CUDA stack just to build
          # docs. `uv sync` would install the locked CUDA torch regardless, so we
          # install via `uv pip install`, which honors --torch-backend (matches CI).
          UV_TORCH_BACKEND: cpu
        run: |
          uv venv
          # leech must be importable (mkdocstrings + the figure script import it),
          # which requires escapepod (pod5). Try with the Rust accel extension
          # (leech-core); fall back without it but keep escapepod.
          uv pip install --torch-backend=cpu -e ".[rust,pod5]" --group docs \
            || uv pip install --torch-backend=cpu -e ".[pod5]" --group docs

      - name: Generate move table figure
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv run --no-sync python scripts/generate_move_table_figure.py

      - name: Build documentation
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv run --no-sync zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "✅ Documentation deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📚 View at: https://rnabioco.github.io/leech" >> $GITHUB_STEP_SUMMARY
