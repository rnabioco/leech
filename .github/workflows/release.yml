name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── Build bundled leech wheels (Python + leech_core Rust extension) ──
  #
  # leech is now a mixed maturin project: each wheel carries the compiled
  # leech_core extension, so `uv add leech` / `pip install leech` gets the Rust
  # acceleration with no separate wheel and no Rust toolchain on the user side.
  # The escapepod-rs submodule is private, so every build job checks it out with
  # ESCAPEPOD_PAT before maturin compiles escapepod-signal.
  linux:
    name: Wheels — linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # No working-directory: maturin reads [tool.maturin] from the repo
          # root pyproject.toml and compiles the crate at rust/Cargo.toml.
          args: --release --out dist --find-interpreter
          manylinux: auto

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    name: Wheels — macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-14
          - target: x86_64
            runner: macos-13
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  windows:
    name: Wheels — windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist/*.whl

  # ── sdist (GitHub release only) ─────────────────────────────────────
  #
  # The sdist references escapepod-signal by relative path into the private
  # escapepod-rs submodule, which is NOT vendored into the archive — so it
  # cannot be rebuilt by third parties. It is published as a GitHub release
  # artifact for provenance only and is deliberately kept OFF PyPI so that
  # platforms without a prebuilt wheel fail clearly instead of attempting a
  # doomed source build.
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish wheels to PyPI via trusted publishing (OIDC) ────────────
  #
  # Requires a PyPI trusted publisher configured for this repo + workflow +
  # the `pypi` environment, and the `escapepod` dependency already published
  # to PyPI (it builds from the private submodule in its own repo).
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ── Create GitHub Release with all artifacts ───────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ESCAPEPOD_PAT }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '{wheels-*,sdist}'
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh dist/

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: check_prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
              /^## / {
                if (found) exit
                if ($0 ~ ver) found=1
                next
              }
              found { print }
            ' CHANGELOG.md)
          fi
          if [ -n "$CHANGELOG_CONTENT" ]; then
            echo "$CHANGELOG_CONTENT" > changelog_extract.md
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            touch changelog_extract.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.found == 'true' && 'changelog_extract.md' || '' }}
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          draft: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** ${{ steps.check_prerelease.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -1 dist/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
