name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v0.1.0-alpha, etc.

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if pre-release
        id: check_prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a pre-release: $VERSION"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release: $VERSION"
          fi

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          # This looks for the version heading and captures everything until the next version heading
          CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # If empty, try without brackets (e.g., ## [0.1.0] vs ## 0.1.0)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
              /^## / {
                if (found) exit
                if ($0 ~ ver) found=1
                next
              }
              found { print }
            ' CHANGELOG.md)
          fi

          # Save to file to preserve formatting
          if [ -n "$CHANGELOG_CONTENT" ]; then
            echo "$CHANGELOG_CONTENT" > changelog_extract.md
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No changelog entry found for version $VERSION"
            echo "found=false" >> $GITHUB_OUTPUT
            touch changelog_extract.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.found == 'true' && 'changelog_extract.md' || '' }}
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          draft: false
          generate_release_notes: true  # Auto-generate from commits/PRs using .github/release.yml config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** ${{ steps.check_prerelease.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the release at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changelog.outputs.found }}" == "true" ]; then
            echo "✅ Changelog section found and included" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No changelog section found for this version" >> $GITHUB_STEP_SUMMARY
          fi
          echo "✅ Auto-generated release notes from commits/PRs" >> $GITHUB_STEP_SUMMARY
