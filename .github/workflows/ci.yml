name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install linting tools only
        # Pin to the ruff resolved in uv.lock so CI checks the same formatting
        # `uv run ruff` applies locally. Unpinned, any ruff release can fail
        # lint on unrelated PRs -- 0.16.0 started formatting Python code blocks
        # inside Markdown, which reformats 11 docs/ and dev-notes/ files.
        run: |
          RUFF_VERSION=$(python -c "
          import tomllib
          lock = tomllib.load(open('uv.lock', 'rb'))
          print(next(p['version'] for p in lock['package'] if p['name'] == 'ruff'))
          ")
          echo "Pinning ruff==${RUFF_VERSION} (from uv.lock)"
          uv pip install --system "ruff==${RUFF_VERSION}"

      - name: Run ruff format check
        run: ruff format --check --exclude vulture_whitelist.py .

      - name: Run ruff lint
        run: ruff check --exclude vulture_whitelist.py .

      - name: Run type check
        run: uvx ty check src/leech/

  rust-lint:
    name: Rust lint + test (fmt + clippy + cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rustfmt + clippy)
        run: rustup component add rustfmt clippy

      - name: Set up Python
        # cargo test (below) links against a real libpython -- see the
        # extension-module feature doc in rust/Cargo.toml. pyo3-build-config
        # discovers it via `python3` on PATH, which must satisfy
        # abi3-py312's floor; matches the Python setup the other two jobs
        # already use, so this job doesn't rely on ubuntu-latest's default.
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        # --no-default-features drops the `extension-module` pyo3 feature so
        # this standalone test binary links against libpython normally; the
        # real wheel build (rust/build.sh, release.yml) keeps it via the
        # default feature set. See rust/Cargo.toml's `extension-module`
        # feature doc for why cargo test needs this.
        run: cargo test --manifest-path rust/Cargo.toml --no-default-features --features test-utils

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Cache the leech_core build. The bulk of the test job is compiling
      # arrow + escapepod-signal + leech_core via maturin; caching target/ and
      # the cargo registry cuts that from minutes to seconds on unchanged deps.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Only the test runner + runtime deps are needed here — no lint/type
      # tooling (that's the Lint job) and no pipeline/notebook extras (tests
      # don't import snakemake/plotnine). `rust` is required, not best-effort:
      # a build break here must fail the job rather than silently drop
      # leech_core (see .github/actions/install-with-rust). `onnx` is here so
      # the export round-trip tests actually RUN rather than skipping: they
      # compare onnxruntime against torch across the serialization boundary,
      # which is the check an in-process assert cannot make.
      - name: Install dependencies
        uses: ./.github/actions/install-with-rust
        with:
          extras: test,rust,onnx

      - name: Run tests
        env:
          UV_TORCH_BACKEND: cpu
        # --no-sync: don't let `uv run` re-sync the env to the CUDA-pinned lock.
        # -rs: print a one-line reason for every skipped test, and pytest's
        # short-summary section (piped below into the job summary) totals them
        # -- so a jump in skip count from a dropped leech_core is visible
        # without opening the raw log.
        run: |
          uv run --no-sync pytest -rs --cov=leech --cov-report=xml --cov-report=term \
            2>&1 | tee pytest-output.log

      - uses: ./.github/actions/pytest-skip-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
