name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install linting tools only
        run: uv pip install --system ruff nbqa

      - name: Run ruff format check
        run: ruff format --check --exclude notebooks/ --exclude vulture_whitelist.py .

      - name: Run ruff lint
        run: ruff check --exclude notebooks/ --exclude vulture_whitelist.py .

      - name: Run ruff lint on notebooks
        run: nbqa ruff notebooks/

      - name: Run type check
        run: uvx ty check src/leech/

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ESCAPEPOD_PAT }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          # GPU-less runner: install the CPU-only torch wheel so uv doesn't pull
          # the multi-GB CUDA stack (nvidia-cu13-*). `uv sync` installs the locked
          # CUDA torch regardless of this, so we install via `uv pip install`,
          # which honors --torch-backend. The lock (and local/cluster GPU installs
          # via `uv sync`) are unchanged.
          UV_TORCH_BACKEND: cpu
        run: |
          uv venv
          # Full install (Rust extension + escapepod); fall back without the
          # Rust extension (leech_core) but keep escapepod (pod5), which leech
          # imports unconditionally.
          uv pip install --torch-backend=cpu -e ".[dev,pipeline,notebook,rust,pod5]" \
            || uv pip install --torch-backend=cpu -e ".[dev,pipeline,notebook,pod5]"

      - name: Run tests
        env:
          UV_TORCH_BACKEND: cpu
        # --no-sync: don't let `uv run` re-sync the env to the CUDA-pinned lock.
        run: uv run --no-sync pytest --cov=leech --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
