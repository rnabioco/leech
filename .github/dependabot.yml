version: 2
updates:
  # Keep Python (uv) dependencies current.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  # leech_core's Rust deps. escapepod-signal is a tag-pinned git dependency,
  # which dependabot does not bump — move that tag by hand in rust/Cargo.toml.
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
    labels:
      - dependencies
