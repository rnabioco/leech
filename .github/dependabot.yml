version: 2
updates:
  # Keep Python (uv) dependencies current.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies

  # leech_core's Rust deps. Note that dependabot DOES move the tag-pinned
  # escapepod-signal git dependency (PR #236 took it v0.16.1 -> v0.18.1), and
  # cannot know that `escapepod` in pyproject.toml has to move with it —
  # leech drives both, so a skew silently changes what `data prepare` computes.
  # `.github/workflows/escapepod-sync.yml` catches that daily and proposes the
  # matching bump.
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
    labels:
      - dependencies
