# Configuration for GitHub's auto-generated release notes
# See: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
    authors:
      - dependabot

  categories:
    - title: 🎉 Features
      labels:
        - feature
        - enhancement
        - feat
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: 🔧 Improvements
      labels:
        - improvement
        - refactor
        - performance
        - perf
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🧪 Testing
      labels:
        - test
        - tests
    - title: 🏗️ Internal Changes
      labels:
        - chore
        - ci
        - build
    - title: Other Changes
      labels:
        - "*"
