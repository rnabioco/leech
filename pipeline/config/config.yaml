# Leech Pipeline Configuration
# ============================

# ============================================================================
# Output Directories - Multi-Cluster Configuration
# ============================================================================
# This pipeline supports multiple cluster environments with different storage models:
#
# BODHI CLUSTER (Local):
# - Home directory: Essentially unlimited storage
# - Can run everything from home directory
# - No strict I/O restrictions
#
# ALPINE CLUSTER (CU Boulder):
# - /home: 2GB quota only
# - /projects: 250GB, backed up, NO intensive I/O
# - /scratch/alpine: 10TB, high I/O, 90-day auto-purge
# - ALL compute jobs MUST write to /scratch/alpine for intensive I/O
#
# Choose one configuration below based on your cluster:

# ----------------------------------------------------------------------------
# Option 1: Local/Bodhi Configuration (unlimited home directory)
# ----------------------------------------------------------------------------
chunks_dir: "results/chunks"
models_dir: "results/models"
inference_dir: "results/inference"
metrics_dir: "results/metrics"

# ----------------------------------------------------------------------------
# Option 2: Alpine Configuration (comment out Option 1, uncomment below)
# ----------------------------------------------------------------------------
# chunks_dir: "/scratch/alpine/$USER/leech/chunks"           # Temporary, high I/O
# models_dir: "/projects/$USER/leech/models"                 # Permanent, backed up
# inference_dir: "/projects/$USER/leech/inference"           # Permanent results
# metrics_dir: "/projects/$USER/leech/metrics"               # Permanent results

# ----------------------------------------------------------------------------
# Option 3: Bodhi with absolute paths
# ----------------------------------------------------------------------------
# chunks_dir: "/home/$USER/leech/results/chunks"
# models_dir: "/home/$USER/leech/results/models"
# inference_dir: "/home/$USER/leech/results/inference"
# metrics_dir: "/home/$USER/leech/results/metrics"

# ============================================================================
# Sample Configuration
# ============================================================================
# Each sample should have:
#   - pod5: path to POD5 file
#   - bam: path to aligned BAM file with mv tags
#   - label: "charged" or "uncharged" (for charged vs uncharged classification)
#   - amino_acid: amino acid label (for pairwise classification, e.g., "Ala", "Gly")
#
# ----------------------------------------------------------------------------
# Sample Data Paths - Cluster-Specific Examples
# ----------------------------------------------------------------------------
# BODHI: Store data in home directory (unlimited)
# ALPINE: Store raw data in /projects (backed up, permanent)

samples:
  # ----------------------------------------------------------------------------
  # Bodhi/Local paths (relative or in home directory)
  # ----------------------------------------------------------------------------
  sample_charged_ala_rep1:
    pod5: "data/charged/ala/rep1.pod5"
    bam: "data/charged/ala/rep1.bam"
    label: "charged"
    amino_acid: "Ala"

  sample_charged_ala_rep2:
    pod5: "data/charged/ala/rep2.pod5"
    bam: "data/charged/ala/rep2.bam"
    label: "charged"
    amino_acid: "Ala"

  sample_charged_gly_rep1:
    pod5: "data/charged/gly/rep1.pod5"
    bam: "data/charged/gly/rep1.bam"
    label: "charged"
    amino_acid: "Gly"

  sample_uncharged_ala_rep1:
    pod5: "data/uncharged/ala/rep1.pod5"
    bam: "data/uncharged/ala/rep1.bam"
    label: "uncharged"
    amino_acid: "Ala"

  sample_uncharged_gly_rep1:
    pod5: "data/uncharged/gly/rep1.pod5"
    bam: "data/uncharged/gly/rep1.bam"
    label: "uncharged"
    amino_acid: "Gly"

  # ----------------------------------------------------------------------------
  # Alpine cluster paths (uncomment for Alpine, comment out above)
  # ----------------------------------------------------------------------------
  # sample_charged_ala_rep1:
  #   pod5: "/projects/$USER/leech/data/charged/ala/rep1.pod5"
  #   bam: "/projects/$USER/leech/data/charged/ala/rep1.bam"
  #   label: "charged"
  #   amino_acid: "Ala"

  # ----------------------------------------------------------------------------
  # Bodhi cluster paths with absolute paths (alternative)
  # ----------------------------------------------------------------------------
  # sample_charged_ala_rep1:
  #   pod5: "/home/$USER/leech/data/charged/ala/rep1.pod5"
  #   bam: "/home/$USER/leech/data/charged/ala/rep1.bam"
  #   label: "charged"
  #   amino_acid: "Ala"

# Amino acids for pairwise classification
# All pairs will be generated automatically: choose(amino_acids, 2)
amino_acids:
  - "Ala"
  - "Gly"
  - "Val"
  - "Leu"
  - "Ile"
  - "Pro"
  - "Phe"
  - "Trp"
  - "Met"
  - "Ser"
  - "Thr"
  - "Cys"
  - "Asn"
  - "Gln"
  - "Tyr"
  - "Lys"
  - "Arg"
  - "His"
  - "Asp"
  - "Glu"

# ============================================================================
# Data Preparation Parameters
# ============================================================================
motif: "CCA"              # tRNA 3' end motif
motif_offset: 2           # Focus on the last "A" (0-indexed)
kmer_len: 5               # K-mer context length
chunk_context: [200, 200] # Signal context (left, right) in samples
train_split: 0.7          # Training set fraction
val_split: 0.15           # Validation set fraction (test = 1 - train - val)

# ============================================================================
# Model Configuration
# ============================================================================
# Default model for single-model runs
model: "ConvLSTMDwell"    # Model architecture: ConvLSTMDwell, ConvLSTMBase, etc.

# Model comparison: Train and evaluate multiple architectures
# Set compare_models: true to enable multi-architecture comparison
compare_models: false

# Models to compare (used when compare_models: true)
# Available models:
#   - ConvLSTMBase: Baseline (signal + sequence only)
#   - ConvLSTMDwell: Full model with dwell features
#   - TransformerDwell: Transformer with self-attention (Priority 1)
#   - ConvOnly: Pure CNN baseline (Priority 1)
#   - TCNDwell: Temporal Convolutional Network (Priority 2)
#   - ResNetDwell: Residual Network (Priority 2)
models_to_compare:
  - "ConvLSTMBase"       # Baseline without dwell
  - "ConvLSTMDwell"      # Original with dwell
  - "TransformerDwell"   # Priority 1
  - "ConvOnly"           # Priority 1
  - "TCNDwell"           # Priority 2
  - "ResNetDwell"        # Priority 2

# Training hyperparameters (used if use_grid_search: false)
epochs: 50
batch_size: 128
learning_rate: 0.001
early_stopping_patience: 5

# Inference parameters
infer_batch_size: 256

# ============================================================================
# Grid Search Configuration
# ============================================================================
use_grid_search: false    # Set to true to use grid search before training

# Grid search parameters
# These define the hyperparameter search space
grid_search:
  learning_rate: [0.0001, 0.001, 0.01]
  batch_size: [64, 128, 256]
  hidden_size: [128, 256, 512]
  num_layers: [1, 2, 3]
  dropout: [0.1, 0.2, 0.3]

grid_search_epochs: 20    # Epochs per grid search trial (shorter than full training)

# ============================================================================
# Cluster-specific settings
# ============================================================================
# These are used by the cluster profiles (profiles/slurm or profiles/lsf)
# and can be overridden per-rule

cluster:
  # ===== Alpine Cluster Settings (CU Boulder) =====
  # Documentation: https://curc.readthedocs.io/en/latest/clusters/alpine/

  # Account/project for billing (REQUIRED for Alpine)
  # Replace with your Alpine allocation account
  account: ""  # e.g., "ucb-general", "your_allocation_name"

  # SLURM Partitions on Alpine:
  # - amilan: CPU-only nodes (default, no GPUs)
  # - aa100: NVIDIA A100 GPU nodes (40GB, 80GB variants)
  # - ami100: AMD MI100 GPU nodes
  # - atesting_a100: Testing partition for A100 GPUs (short jobs)
  # - atesting_mi100: Testing partition for MI100 GPUs (short jobs)
  default_partition: "amilan"
  gpu_partition: "aa100"      # Default GPU partition for training/inference

  # Quality of Service (QoS) settings:
  # - normal: Standard jobs (up to 24 hours)
  # - long: Extended jobs (24+ hours, limited availability)
  # - testing: Short test jobs on testing partitions
  default_qos: "normal"
  testing_qos: "testing"

  # Alpine GPU node specifications:
  # - aa100 nodes: 64 cores, 42 tasks per node recommended
  # - ami100 nodes: 64 cores, 16 tasks per node recommended
  # - Each A100 node has 3 GPUs (40GB or 80GB VRAM)
  default_ntasks: 42          # For aa100 partition

  # Time limits (minutes)
  default_time: 120
  training_time: 480          # 8 hours
  grid_search_time: 1440      # 24 hours
  testing_time: 60            # 1 hour for testing partition

  # Memory defaults (MB)
  default_mem: 8000
  training_mem: 16000

  # Job submission settings
  max_jobs: 100               # Maximum concurrent jobs
  latency_wait: 60            # Seconds to wait for output files

  # ===== LSF Cluster Settings (for non-Alpine clusters) =====
  # These are used if you're running on an LSF cluster instead
  default_queue: "gpuqueue"   # LSF queue
  gpu_queue: "gpuqueue"
  gpu_model: "a100"           # For LSF: model for -R "select[gpu_model==...]"
