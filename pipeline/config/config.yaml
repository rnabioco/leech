# Leech Pipeline Configuration
# ============================

# ============================================================================
# Project Name
# ============================================================================
# Optional project name to organize multiple workflows/projects.
# If set, creates project-specific subdirectories under the leech installation.
#
# Examples:
#   project_name: ""                  # Default: no project subdirectory
#   project_name: "synthetic-trna"    # Creates leech/synthetic-trna/pod5, etc.
#   project_name: "native-ecoli"      # Creates leech/native-ecoli/pod5, etc.
#
# Directory structure without project_name:
#   /scratch/alpine/user/leech/pod5/{sample}/
#   /scratch/alpine/user/leech/chunks/{sample}/
#
# Directory structure with project_name: "synthetic-trna"
#   /scratch/alpine/user/leech/synthetic-trna/pod5/{sample}/
#   /scratch/alpine/user/leech/synthetic-trna/chunks/{sample}/
#
# Set in sample-specific config files (e.g., config/samples-alpine.yaml)
project_name: ""

# ============================================================================
# Output Directories
# ============================================================================
# Default output directories (relative paths for local/Bodhi)
# Cluster-specific absolute paths are defined in cluster profiles.
#
# Note: If project_name is set, it will be automatically inserted into these paths.
# For example, with project_name: "synthetic-trna":
#   /scratch/alpine/user/leech/pod5 -> /scratch/alpine/user/leech/synthetic-trna/pod5
#
# For cluster-specific configurations:
# - Alpine: See profiles/slurm/config.yaml for /scratch and /projects paths
# - Bodhi: Use these defaults or override in profiles/lsf/config.yaml
#
# All outputs on scratch for testing (fast I/O, 90-day purge)
# Move to /projects for permanent storage after testing
chunks_dir: "/scratch/alpine/$USER/leech/chunks"
models_dir: "/scratch/alpine/$USER/leech/models"
inference_dir: "/scratch/alpine/$USER/leech/inference"
metrics_dir: "/scratch/alpine/$USER/leech/metrics"

# ============================================================================
# Sample Configuration
# ============================================================================
# Sample definitions are in separate files for each cluster/environment.
# This allows cluster-specific paths and configurations without conflicts.
#
# Available sample configuration files:
#   - config/samples-alpine.yaml: Alpine cluster samples (CU Boulder)
#   - config/samples-bodhi.yaml: Bodhi cluster samples (optional)
#   - config/samples-local.yaml: Local/testing samples (optional)
#
# Each sample should have:
#   - pod5: path to POD5 file or directory
#   - bam: path to aligned BAM file (optional, can be generated by pipeline)
#   - label: sample label used in comparison spec files (e.g., "Ala", "Gly", "uncharged")
#
# Usage:
#   snakemake --configfile config/samples-alpine.yaml --profile profiles/slurm
#   snakemake --configfile config/samples-bodhi.yaml --profile profiles/lsf
#
# Note: samples are no longer defined in this main config file to avoid
# cluster-specific paths and conflicts.

# ============================================================================
# Comparison Specification
# ============================================================================
# Specify which pairwise comparisons to run via a TSV file.
# All comparisons (including charged vs uncharged) are defined uniformly
# in TSV files with the format:
#   meta_label1 \t label_set1 \t meta_label2 \t label_set2
#
# Available comparison spec files:
#   - config/comparisons_charged_uncharged.tsv: Testing (Ala vs uncharged only)
#   - config/comparisons_chemical_properties.tsv: Chemical property groups
#   - config/comparisons_all_pairwise.tsv: All pairwise amino acid comparisons
#
# Examples:
#   comparison_spec_file: "config/comparisons_charged_uncharged.tsv"
#   comparison_spec_file: "config/comparisons_chemical_properties.tsv"
#   comparison_spec_file: "config/comparisons_all_pairwise.tsv"
#
# For testing the pipeline, use comparisons_charged_uncharged.tsv (fastest).
# For full analysis, use comparisons_all_pairwise.tsv or comparisons_chemical_properties.tsv.
comparison_spec_file: "config/comparisons_charged_uncharged.tsv"

# ============================================================================
# Device Configuration (CPU vs GPU)
# ============================================================================
# Toggle between CPU and GPU training modes
# - GPU mode (use_cpu_training: false): Uses aa100 partition with GPU acceleration
# - CPU mode (use_cpu_training: true): Uses amilan partition with CPU-only training
#
# CPU training is ~10-50x slower but useful when:
# - GPU partition queue times are long
# - Running small experiments or debugging
# - GPU resources are limited
#
# When enabled, automatically:
# - Changes partition from aa100 to amilan
# - Removes GPU resource requests
# - Increases runtime allocation (60 min → 240 min)
# - Increases CPU cores (10 → 16)
# - Sets --device cpu flag for all training/inference commands
use_cpu_training: true # Set to true to enable CPU training mode

# ============================================================================
# Data Preparation Parameters
# ============================================================================
motif: "CCATGGC"          # tRNA 3' end motif (CCA + TGG + C adaptor)
motif_offset: 3           # Focus on the position where amino acid is attached (0-indexed)
motif_reference: "fasta"  # Search motif in reference ("fasta") or basecalled ("bam") sequence
reference_fasta: "pipeline/resources/references/synthetic-trna.fa"  # External reference FASTA
skip_motif_indels: true   # Skip reads with indels in motif region
kmer_len: 3               # K-mer context length (bases on each side of focus base)
chunk_context: [200, 200] # Signal context (left, right) in samples
train_split: 0.7          # Training set fraction
val_split: 0.15           # Validation set fraction (test = 1 - train - val)

# Parallel processing for data preparation
# Workers will be automatically matched to cpus_per_task from cluster config
workers: 8                # Number of parallel workers (default: 8, matches cluster cpus_per_task)
chunk_size: 100           # Number of reads per batch for parallel processing

# ============================================================================
# Dorado Rebasecalling Configuration
# ============================================================================
# Scratch directory for intermediate files (POD5 merging, basecalling, alignment)
# Set to null or "" to use regular output directories
# Using scratch improves I/O performance for large POD5/BAM files
#
# Cluster-specific recommendations:
# - Alpine: "/scratch/alpine/$USER/leech/tmp" (high I/O, 10TB, 90-day purge)
# - Bodhi: "" or null (use home directory, unlimited storage)
# - Local: "" or null (use regular output directories)
scratch_dir: "/scratch/alpine/$USER/leech/tmp"

# Output directories for rebasecalling workflow
# If scratch_dir is set, intermediate files are processed in scratch_dir
# and final outputs are placed in these directories (which can also be on scratch)
#
# For Alpine: Use scratch paths for fast I/O and large file storage
# Files on scratch are purged after 90 days (sufficient for pipeline intermediates)
pod5_dir: "/scratch/alpine/$USER/leech/pod5"
rebasecall_dir: "/scratch/alpine/$USER/leech/bam/rebasecall"

# Reference genome/transcriptome for alignment
# Required for aligning rebasecalled reads
# Example: "references/transcriptome.fasta" or "references/genome.fasta"
reference: "pipeline/resources/references/synthetic-trna.fa"

# Dorado binary path
# Set to "dorado" to use system PATH, or specify full path to binary
# Examples:
#   - "dorado"                    (use system PATH)
#   - "/usr/local/bin/dorado"     (specific path)
#   - "/home/user/software/dorado-0.5.0/bin/dorado"
#
# Cluster-specific examples:
# - Alpine: "$HOME/software/dorado/bin/dorado" or "dorado" if in PATH
# - Bodhi: "$HOME/projects/software/dorado/bin/dorado"
dorado_bin: "dorado"

# Samtools binary path
# Set to "samtools" to use system PATH, or specify full path to binary
samtools_bin: "samtools"

# Minimap2 binary path
# Set to "minimap2" to use system PATH, or specify full path to binary
minimap2_bin: "minimap2"

# Dorado basecalling model
# Available models: https://github.com/nanoporetech/dorado#available-basecalling-models
#
# RNA models (recommended for tRNA-seq):
#   - rna004_130bps_sup@v5.2.0  (super accurate, best quality, DEFAULT)
#   - rna004_130bps_hac@v5.2.0  (high accurate, faster)
#   - rna004_130bps_fast@v5.2.0 (fast, lower accuracy)
#
# DNA models (for testing):
#   - dna_r10.4.1_e8.2_400bps_sup@v4.2.0
#   - dna_r10.4.1_e8.2_400bps_hac@v4.2.0
#   - dna_r10.4.1_e8.2_400bps_fast@v4.2.0
base_calling_model: "rna004_130bps_sup@v5.2.0"

# Modified base detection
# To enable modification calling, specify modifications as a comma-separated list
# The model will be invoked as: {base_calling_model},{modifications}
# Leave empty or null to disable modification detection
#
# Available RNA modifications (for rna004_130bps_sup@v5.2.0):
#   - m5C_2OmeC: 5-methylcytosine and 2'-O-methylcytosine
#   - m6A_DRACH: N6-methyladenosine in DRACH motif
#   - inosine_m6A_2OmeA: Inosine, m6A, and 2'-O-methyladenosine
#   - pseU_2OmeU: Pseudouridine and 2'-O-methyluridine
#   - 2OmeG: 2'-O-methylguanosine
#
# Examples:
#   modifications: ""                                          # No modifications
#   modifications: "m6A_DRACH"                                 # Single modification
#   modifications: "m6A_DRACH,pseU_2OmeU"                      # Multiple modifications
#   modifications: "m5C_2OmeC,m6A_DRACH,inosine_m6A_2OmeA,pseU_2OmeU,2OmeG"  # All RNA mods (default)
# modifications: "m5C_2OmeC,m6A_DRACH,inosine_m6A_2OmeA,pseU_2OmeU,2OmeG"
modifications: ""

# Dorado options
# IMPORTANT: --emit-moves is required for leech to extract dwell times
dorado_opts: "--emit-moves"

# Resource allocation for rebasecalling
# NOTE: Resource allocation (threads, memory, time, GPUs) is now fully managed
# by cluster profiles. See profiles/slurm/config.yaml or profiles/lsf/config.yaml
# for cluster-specific resource configurations.

# ============================================================================
# Model Configuration
# ============================================================================
# Default model for single-model runs
model: "ConvLSTMDwell"    # Model architecture: ConvLSTMDwell, ConvLSTMBase, etc.

# Model comparison: Train and evaluate multiple architectures
# Set compare_models: true to enable multi-architecture comparison
compare_models: true

# Models to compare (used when compare_models: true)
# Available models:
#   - ConvLSTMBase: Baseline (signal + sequence only)
#   - ConvLSTMDwell: Full model with dwell features
#   - TransformerDwell: Transformer with self-attention (Priority 1)
#   - ConvOnly: Pure CNN baseline (Priority 1)
#   - TCNDwell: Temporal Convolutional Network (Priority 2)
#   - ResNetDwell: Residual Network (Priority 2)
models_to_compare:
  - "ConvLSTMBase"       # Baseline without dwell
  - "ConvLSTMDwell"      # Original with dwell
  - "TransformerDwell"   # Priority 1
  - "ConvOnly"           # Priority 1
  - "TCNDwell"           # Priority 2
  - "ResNetDwell"        # Priority 2

# Training hyperparameters (used if use_grid_search: false)
epochs: 50
batch_size: 128
learning_rate: 0.001
early_stopping_patience: 5

# Inference parameters
infer_batch_size: 256

# ============================================================================
# Grid Search Configuration
# ============================================================================
use_grid_search: false    # Set to true to use grid search before training

# Grid search parameters
# `leech model optimize` searches signal context windows and dwell offset --
# NOT learning rate, batch size, or layer sizes. Values may be given as a list
# or as a "start:stop:step" range string.
grid_search:
  context_grid: "200:1000:200"   # symmetric fallback when left/right unset
  # left_contexts: [200, 500, 1000]
  # right_contexts: [200, 500]
  dwell_offsets: "0"

grid_search_epochs: 20    # Epochs per grid search trial (shorter than full training)
grid_search_parallel: 1   # Concurrent trials per grid search job

# ============================================================================
# Cluster-specific settings
# ============================================================================
# NOTE: All cluster-specific settings (partitions, QoS, resource allocation,
# accounts, queues, etc.) are now managed by cluster profiles.
#
# To use this pipeline on a cluster:
# 1. Choose the appropriate profile: profiles/slurm or profiles/lsf
# 2. Edit the profile's config.yaml for your cluster environment
# 3. Run with: snakemake --profile profiles/slurm [other options]
#
# Cluster profiles provide:
# - SLURM (Alpine): profiles/slurm/config.yaml
#   * Partition/QoS settings (amilan, aa100, atesting_a100, etc.)
#   * Account/billing configuration
#   * GPU allocation for training/inference
#   * Per-rule resource overrides
#
# - LSF (Bodhi): profiles/lsf/config.yaml
#   * Queue configuration (gpuqueue, etc.)
#   * GPU model selection
#   * Per-rule resource overrides
