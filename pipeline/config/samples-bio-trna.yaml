# ============================================================================
# Data Preparation Parameters
# ============================================================================
# These parameters control how training chunks are extracted from biological samples
# They should match the parameters used for training the charging classification model

motif: "CCATGGC"          # tRNA 3' end motif (CCA + adapter sequence)
motif_offset: 3           # Focus on amino acid attachment position (0-indexed)
motif_reference: "fasta"  # Search motif in reference ("fasta") or basecalled ("bam") sequence
skip_motif_indels: true   # Skip reads with indels in motif region
kmer_len: 3               # K-mer context length (bases on each side of focus base)
chunk_context: [200, 200] # Signal context (left, right) in samples

# Training/validation/test split ratios
train_split: 0.7          # Training set fraction
val_split: 0.15           # Validation set fraction (test = 1 - train - val)

# Parallel processing for data preparation
workers: 8                # Number of parallel workers
chunk_size: 100           # Number of reads per batch for parallel processing

# ============================================================================
# Model Configuration
# ============================================================================
# Model architecture and training hyperparameters for biological models

model: "ConvLSTMDwell"    # Model architecture: ConvLSTMDwell, ConvLSTMBase, etc.

# Training hyperparameters
epochs: 50
batch_size: 128
learning_rate: 0.001
early_stopping_patience: 5

# Inference parameters
infer_batch_size: 256

# Device configuration
use_cpu_training: true    # Set to true for CPU training, false for GPU

# ============================================================================
# Notes
# ============================================================================
#
# Workflow Steps:
# 1. Align biological reads to tRNA reference database
# 2. Classify reads by charging status using pre-trained model
# 3. Split reads into groups: {AA}_{charged|uncharged}
# 4. Extract training chunks for each group
# 5a. Train pairwise AA models (Ala vs Arg, Ala vs Asn, etc.)
# 5b. Train per-AA charging models (Ala-charged vs Ala-uncharged, etc.)
#
# Usage:
#   # Run full biological workflow
#   snakemake --configfile config/samples-bio-trna.yaml --profile profiles/slurm
#
#   # Run specific steps
#   snakemake --configfile config/samples-bio-trna.yaml --profile profiles/slurm all_bio_align
#   snakemake --configfile config/samples-bio-trna.yaml --profile profiles/slurm all_bio_prepare
#   snakemake --configfile config/samples-bio-trna.yaml --profile profiles/slurm all_bio_train_pairwise_aa
#   snakemake --configfile config/samples-bio-trna.yaml --profile profiles/slurm all_bio_train_charging
#
