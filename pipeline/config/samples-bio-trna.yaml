  #   bam: "/path/to/yeast_bio/basecalls.bam"
  #   label: "biological"
  #   description: "S. cerevisiae biological sample"
  #   amino_acids: ["Ala", "Gly", "Leu", "Val"]  # Specify if only subset expected

