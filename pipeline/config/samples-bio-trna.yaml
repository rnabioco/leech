# Leech Pipeline - Biological tRNA Sample Configuration
# ======================================================
# Configuration for biological tRNA samples used to train discriminative models
#
# Each biological sample should have:
#   - pod5: path to POD5 file or directory
#   - bam: path to basecalled BAM file (with move tables)
#   - label: "biological" (or other descriptive label)
#   - amino_acids: list of expected amino acids (optional, will be detected from alignment)
#
# Note: The workflow will:
# 1. Align reads to tRNA reference database to identify amino acid
# 2. Classify charging status using pre-trained model
# 3. Split reads by AA + charging status
# 4. Train discriminative models

# ============================================================================
# Project Name
# ============================================================================
# Project name for organizing biological tRNA workflow outputs
# This creates subdirectories like:
#   /scratch/alpine/user/leech/bio-trna/bam/{sample}/
#   /scratch/alpine/user/leech/bio-trna/chunks/{sample}/
#   etc.
project_name: "bio-trna"

# ============================================================================
# tRNA Reference Database
# ============================================================================
# Path to tRNA reference database (FASTA format)
# Reference names should follow format: tRNA-{AA}-{anticodon}-{number}
# Examples: tRNA-Ala-AGC-1-1, tRNA-Arg-ACG-1-1, etc.
#
# Recommended sources:
# - GtRNAdb: http://gtrnadb.ucsc.edu/ (genomic tRNAs)
# - tRNAscan-SE output
# - Custom synthetic tRNA sequences
trna_reference: "pipeline/resources/references/trna-reference.fa"

# ============================================================================
# Pre-trained Charging Classification Model
# ============================================================================
# Path to pre-trained model for classifying charged vs uncharged status
# This should be a model trained on synthetic samples using the main pipeline
#
# To generate this model, first run the synthetic pipeline:
#   snakemake --configfile config/samples-alpine.yaml \
#             --config comparison_spec_file=config/comparisons_charged_uncharged.tsv \
#             --profile profiles/slurm
#
# Then point to the trained model:
charging_model: "results/models/pairwise/charged_uncharged/model_best.pt"

# Probability threshold for charging classification (0.0-1.0)
# Reads with P(charged) >= threshold are classified as charged
charging_threshold: 0.5

# ============================================================================
# Biological Sample Comparisons
# ============================================================================
# Specify which comparisons to run for biological samples
#
# Pairwise amino acid discrimination (190 comparisons)
bio_aa_comparison_spec_file: "config/comparisons_bio_pairwise_aa.tsv"
#
# Per-amino acid charging discrimination (20 comparisons)
bio_charging_comparison_spec_file: "config/comparisons_bio_per_aa_charging.tsv"

# ============================================================================
# Output Directories for Biological Workflow
# ============================================================================
# All biological outputs are kept separate from synthetic workflow
# If project_name is set, these will be organized under:
#   /scratch/alpine/user/leech/bio-trna/...
bio_bam_dir: "/scratch/alpine/jhesselberth@xsede.org/leech/bam/bio"
bio_chunks_dir: "/scratch/alpine/jhesselberth@xsede.org/leech/chunks/bio"
bio_models_dir: "/scratch/alpine/jhesselberth@xsede.org/leech/models/bio"
bio_inference_dir: "/scratch/alpine/jhesselberth@xsede.org/leech/inference/bio"
bio_metrics_dir: "/scratch/alpine/jhesselberth@xsede.org/leech/metrics/bio"

# ============================================================================
# Biological Samples
# ============================================================================
# Define biological tRNA samples here
# Each sample represents a biological experiment with mixed tRNAs
#
# Example configurations for different experimental setups:

bio_samples:
