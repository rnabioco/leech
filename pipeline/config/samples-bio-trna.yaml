  # ecoli_bio_rep1:
  #   pod5: "/path/to/ecoli_bio_rep1/pod5_pass"
  #   bam: "/path/to/ecoli_bio_rep1/basecalls.bam"
  #   label: "biological"
  #   description: "E. coli biological sample, replicate 1"
  #   # Optional: Specify expected amino acids (will be auto-detected if omitted)
  #   # amino_acids: ["Ala", "Arg", "Asn", "Asp", "Cys", "Gln", "Glu", "Gly", "His", "Ile", "Leu", "Lys", "Met", "Phe", "Pro", "Ser", "Thr", "Trp", "Tyr", "Val"]

  # Example 2: Human biological sample (multiple replicates)
  # human_bio_rep1:
  #   pod5: "/path/to/human_bio_rep1/pod5_pass"
  #   bam: "/path/to/human_bio_rep1/basecalls.bam"
  #   label: "biological"
  #   description: "Human biological sample, replicate 1"
  #
  # human_bio_rep2:
  #   pod5: "/path/to/human_bio_rep2/pod5_pass"
  #   bam: "/path/to/human_bio_rep2/basecalls.bam"
