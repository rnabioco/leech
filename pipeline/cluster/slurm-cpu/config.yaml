# Snakemake SLURM Profile - Production (CPU training)
# ======================================================
# Alpine cluster configuration for CPU-only training/eval/inference/grid-search.
# Usage: snakemake --profile pipeline/cluster/slurm-cpu --configfile config/samples-alpine.yaml
#
# Pair this profile with `use_cpu_training: true` in pipeline/config/config.yaml
# (the leech CLI's `--device cpu` flag lives in the rule `params:`, independent
# of this file -- see pipeline/cluster/slurm/config.yaml's header for why the
# two have to be set together rather than one implying the other). CPU
# training is ~10-50x slower than GPU; use it for long GPU queues, debugging,
# or small experiments.
#
# This file is otherwise identical to pipeline/cluster/slurm/config.yaml:
# rules whose resources do not depend on use_cpu_training (POD5 processing,
# data preparation, comparison/summary, and dorado basecalling, which has no
# CPU mode) carry the same values in both profiles.

executor: slurm
jobs: 200
max-jobs-per-second: 20
latency-wait: 30
restart-times: 2
rerun-incomplete: true
keep-going: true
printshellcmds: true

jobname: "leech-{rule}-{wildcards}-{jobid}"

# Default resources
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general
  ntasks: 1
  runtime: 120
  mem_mb: 8000
  cpus_per_task: 8

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # ============================================================================
  # POD5 Processing Rules
  # ============================================================================
  merge_pods:
    runtime: 120
    mem_mb: 16000
    cpus_per_task: 12

  inspect_merged_pod5:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 4

  inspect_sample_pod5s:
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 4

  aggregate_all_inspections:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  # ============================================================================
  # Basecalling and Alignment Rules
  # ============================================================================
  # Always GPU: dorado basecalling has no CPU mode in this pipeline.
  rebasecall:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  align_rebasecalled:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8

  # ============================================================================
  # Data Preparation Rules (CPU only, identical in both profiles)
  # ============================================================================
  prepare_chunks:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  reprepare_chunks_optimized_pairwise:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_optimized_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  reprepare_chunks_optimized_architecture:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_optimized_architecture:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # ============================================================================
  # Grid Search Rules (CPU)
  # ============================================================================
  grid_search_pairwise_aa:
    slurm_partition: amilan
    runtime: 240
    cpus_per_task: 16
    mem_mb: 16000

  grid_search_architecture_pairwise:
    slurm_partition: amilan
    runtime: 1400
    cpus_per_task: 16
    mem_mb: 16000

  # ============================================================================
  # Training Rules (CPU)
  # ============================================================================
  # train_pairwise_aa: mem_mb/gres stay in train.smk's `resources:` lambda --
  # see pipeline/cluster/slurm/config.yaml's matching entry.
  train_pairwise_aa:
    slurm_partition: amilan
    runtime: 480
    cpus_per_task: 16

  train_architecture_pairwise:
    slurm_partition: amilan
    runtime: 480
    cpus_per_task: 16
    mem_mb: 16000

  # ============================================================================
  # Inference Rules (CPU)
  # ============================================================================
  infer_pairwise_aa:
    slurm_partition: amilan
    runtime: 960
    cpus_per_task: 16
    mem_mb: 8000

  # ============================================================================
  # Testing/Evaluation Rules (CPU)
  # ============================================================================
  test_pairwise_aa:
    slurm_partition: amilan
    runtime: 240
    cpus_per_task: 16
    mem_mb: 4000

  test_architecture_pairwise:
    slurm_partition: amilan
    runtime: 240
    cpus_per_task: 16
    mem_mb: 4000

  # ============================================================================
  # Comparison and Summary Rules (CPU only, identical in both profiles)
  # ============================================================================
  compare_architectures_pairwise:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  summarize_pairwise:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1
