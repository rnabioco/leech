# LSF Cluster Profile for Leech Pipeline (Bodhi Cluster)
# ========================================================
# Uses snakemake-executor-plugin-lsf
# https://github.com/BEFH/snakemake-executor-plugin-lsf
#
# Usage:
#   snakemake --profile cluster/lsf --configfile config/config.yaml

executor: lsf
jobs: 100

# N.B. GB values should be passed to mem_mb
default-resources:
  - 'mem_mb=8'
  - 'lsf_queue=rna'
  - 'lsf_project=leech'
  - 'lsf_extra=""'

resources:
  - ngpu=12

# set rule specific requirements
set-resources:
  # ============================================================================
  # POD5 Processing Rules
  # ============================================================================
  - merge_pods:mem_mb=16

  - inspect_merged_pod5:mem_mb=4

  - inspect_sample_pod5s:mem_mb=4

  # ============================================================================
  # Basecalling and Alignment Rules (GPU)
  # ============================================================================
  - rebasecall:lsf_queue="gpu"
  - rebasecall:lsf_extra="-gpu num=1:j_exclusive=yes"
  - rebasecall:ngpu=1
  - rebasecall:mem_mb=16

  - align_rebasecalled:mem_mb=16

  # ============================================================================
  # Data Preparation Rules
  # ============================================================================
  - prepare_chunks:mem_mb=8

  - merge_chunks_charged:mem_mb=16

  - merge_chunks_pairwise:mem_mb=16

  # ============================================================================
  # Grid Search Rules (GPU)
  # ============================================================================
  - grid_search_charged_vs_uncharged:lsf_queue="gpu"
  - grid_search_charged_vs_uncharged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - grid_search_charged_vs_uncharged:ngpu=1
  - grid_search_charged_vs_uncharged:mem_mb=16

  - grid_search_pairwise_aa:lsf_queue="gpu"
  - grid_search_pairwise_aa:lsf_extra="-gpu num=1:j_exclusive=yes"
  - grid_search_pairwise_aa:ngpu=1
  - grid_search_pairwise_aa:mem_mb=16

  - grid_search_architecture_charged:lsf_queue="gpu"
  - grid_search_architecture_charged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - grid_search_architecture_charged:ngpu=1
  - grid_search_architecture_charged:mem_mb=16

  - grid_search_architecture_pairwise:lsf_queue="gpu"
  - grid_search_architecture_pairwise:lsf_extra="-gpu num=1:j_exclusive=yes"
  - grid_search_architecture_pairwise:ngpu=1
  - grid_search_architecture_pairwise:mem_mb=16

  # ============================================================================
  # Training Rules (GPU)
  # ============================================================================
  - train_charged_vs_uncharged:lsf_queue="gpu"
  - train_charged_vs_uncharged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - train_charged_vs_uncharged:ngpu=1
  - train_charged_vs_uncharged:mem_mb=76

  - train_pairwise_aa:lsf_queue="gpu"
  - train_pairwise_aa:lsf_extra="-gpu num=1:j_exclusive=yes"
  - train_pairwise_aa:ngpu=1
  - train_pairwise_aa:mem_mb=76

  - train_architecture_charged:lsf_queue="gpu"
  - train_architecture_charged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - train_architecture_charged:ngpu=1
  - train_architecture_charged:mem_mb=16

  - train_architecture_pairwise:lsf_queue="gpu"
  - train_architecture_pairwise:lsf_extra="-gpu num=1:j_exclusive=yes"
  - train_architecture_pairwise:ngpu=1
  - train_architecture_pairwise:mem_mb=16

  # ============================================================================
  # Inference Rules (GPU)
  # ============================================================================
  - infer_charged_vs_uncharged:lsf_queue="gpu"
  - infer_charged_vs_uncharged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - infer_charged_vs_uncharged:ngpu=1
  - infer_charged_vs_uncharged:mem_mb=8

  - infer_pairwise_aa:lsf_queue="gpu"
  - infer_pairwise_aa:lsf_extra="-gpu num=1:j_exclusive=yes"
  - infer_pairwise_aa:ngpu=1
  - infer_pairwise_aa:mem_mb=8

  # ============================================================================
  # Testing/Evaluation Rules (GPU)
  # ============================================================================
  - test_charged_vs_uncharged:lsf_queue="gpu"
  - test_charged_vs_uncharged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - test_charged_vs_uncharged:ngpu=1
  - test_charged_vs_uncharged:mem_mb=4

  - test_pairwise_aa:lsf_queue="gpu"
  - test_pairwise_aa:lsf_extra="-gpu num=1:j_exclusive=yes"
  - test_pairwise_aa:ngpu=1
  - test_pairwise_aa:mem_mb=4

  - test_architecture_charged:lsf_queue="gpu"
  - test_architecture_charged:lsf_extra="-gpu num=1:j_exclusive=yes"
  - test_architecture_charged:ngpu=1
  - test_architecture_charged:mem_mb=4

  - test_architecture_pairwise:lsf_queue="gpu"
  - test_architecture_pairwise:lsf_extra="-gpu num=1:j_exclusive=yes"
  - test_architecture_pairwise:ngpu=1
  - test_architecture_pairwise:mem_mb=4

  # ============================================================================
  # Comparison and Summary Rules (CPU only)
  # ============================================================================
  - compare_architectures_charged:mem_mb=2

  - compare_architectures_pairwise:mem_mb=2

  - summarize_charged_vs_uncharged:mem_mb=1

  - summarize_pairwise:mem_mb=1

printshellcmds: True
show-failed-logs: True
latency-wait: 15
