# Snakemake SLURM Profile - Production (GPU)
# ============================================
# Alpine cluster production configuration, GPU training/inference/grid-search.
# Usage: snakemake --profile pipeline/cluster/slurm --configfile config/samples-alpine.yaml
#
# CPU/GPU Toggle Support:
# -----------------------
# `use_cpu_training` in config/config.yaml picks the leech CLI's `--device`
# flag (cpu vs. cuda) for training/eval/inference/grid-search -- an
# application-level choice, so it stays a rule `params:` lambda. The SLURM
# resources those same rules need (partition, runtime, cpus, GPU count) are a
# *cluster* choice, and Snakemake's `set-resources` (profile) always wins over
# a rule's own `resources:` block -- so a single profile cannot express both
# modes for one rule name; it always uses whatever this file says. Pick the
# profile that matches your `use_cpu_training` setting:
#
#   use_cpu_training: false (default) -> --profile pipeline/cluster/slurm       (this file, GPU)
#   use_cpu_training: true             -> --profile pipeline/cluster/slurm-cpu  (CPU)
#
# Rules whose resources do not depend on that toggle (POD5 processing, data
# preparation, comparison/summary) are identical in both profiles.

executor: slurm
jobs: 200
max-jobs-per-second: 20
latency-wait: 30
restart-times: 2
rerun-incomplete: true
keep-going: true
printshellcmds: true

# SLURM settings
# No storage provider needed - using shared filesystem directly

# Job naming - use project name, rule name and wildcards for readable job names
# Example: "Snakemake-synthetic-trna-prepare_chunks-ala_synthetic-12345"
# jobname: "Snakemake-{config[project_name]}-{rule}-{wildcards}-{jobid}"
jobname: "leech-{rule}-{wildcards}-{jobid}"

# Default resources
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general
  ntasks: 1
  runtime: 120
  mem_mb: 8000
  cpus_per_task: 8

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # ============================================================================
  # POD5 Processing Rules
  # ============================================================================
  merge_pods:
    runtime: 120
    mem_mb: 16000
    cpus_per_task: 12

  inspect_merged_pod5:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 4

  inspect_sample_pod5s:
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 4

  aggregate_all_inspections:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  # ============================================================================
  # Basecalling and Alignment Rules
  # ============================================================================
  # Always GPU: dorado basecalling, unlike training/eval/inference below, has
  # no CPU mode in this pipeline, so these are identical in both profiles.
  rebasecall:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  align_rebasecalled:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8

  # ============================================================================
  # Data Preparation Rules (CPU only, identical in both profiles)
  # ============================================================================
  prepare_chunks:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # Grid-search-optimized re-prepare/re-merge handoff (grid_search.smk,
  # compare_models.smk) -- same shape as prepare_chunks/merge_chunks_pairwise.
  reprepare_chunks_optimized_pairwise:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_optimized_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  reprepare_chunks_optimized_architecture:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_optimized_architecture:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # Channel-ablation re-prepare/re-merge handoff (ablation.smk, opt-in via
  # use_channel_ablation) -- same shape as the pairwise/architecture ones
  # above; prepare_chunks re-run with --feature-channels all instead of a
  # different --signal-context.
  ablation_prepare_chunks:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  ablation_merge_chunks:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # ============================================================================
  # Grid Search Rules (GPU)
  # ============================================================================
  grid_search_pairwise_aa:
    slurm_partition: aa100
    runtime: 240
    cpus_per_task: 4
    mem_mb: 16000
    gres: "gpu:1"

  grid_search_architecture_pairwise:
    slurm_partition: aa100
    runtime: 480
    cpus_per_task: 4
    mem_mb: 16000
    gres: "gpu:1"

  # ============================================================================
  # Training Rules (GPU)
  # ============================================================================
  # train_pairwise_aa: mem_mb/gres are NOT set here -- they scale with the
  # `train_gpus` config key (a per-run GPU count, not a CPU/GPU mode choice)
  # and stay in train.smk's `resources:` lambda, which this profile's
  # per-rule set-resources leaves untouched by omission.
  train_pairwise_aa:
    slurm_partition: aa100
    runtime: 60
    cpus_per_task: 10

  train_architecture_pairwise:
    slurm_partition: aa100
    runtime: 480
    cpus_per_task: 4
    mem_mb: 16000
    gres: "gpu:1"

  # Channel-ablation training (ablation.smk, opt-in). Always single-GPU, like
  # train_architecture_pairwise -- there is no per-arm/per-seed reason to
  # scale mem_mb/gres the way train_pairwise_aa's train_gpus lambda does.
  ablation_train:
    slurm_partition: aa100
    runtime: 480
    cpus_per_task: 4
    mem_mb: 16000
    gres: "gpu:1"

  # ============================================================================
  # Inference Rules (GPU)
  # ============================================================================
  infer_pairwise_aa:
    slurm_partition: aa100
    runtime: 240
    cpus_per_task: 4
    mem_mb: 8000
    gres: "gpu:1"

  # ============================================================================
  # Testing/Evaluation Rules (GPU)
  # ============================================================================
  test_pairwise_aa:
    slurm_partition: atesting_a100
    runtime: 60
    cpus_per_task: 2
    mem_mb: 4000
    gres: "gpu:1"

  test_architecture_pairwise:
    slurm_partition: atesting_a100
    runtime: 60
    cpus_per_task: 2
    mem_mb: 4000
    gres: "gpu:1"

  # Channel-ablation evaluation (ablation.smk, opt-in) -- same shape as
  # test_architecture_pairwise.
  ablation_test:
    slurm_partition: atesting_a100
    runtime: 60
    cpus_per_task: 2
    mem_mb: 4000
    gres: "gpu:1"

  # ============================================================================
  # Comparison and Summary Rules (CPU only, identical in both profiles)
  # ============================================================================
  compare_architectures_pairwise:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  summarize_pairwise:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  # Channel-ablation aggregate (ablation.smk, opt-in) -- same shape as
  # compare_architectures_pairwise/summarize_pairwise; it reads
  # `len(pairs) * len(arms) * len(seeds)` small JSON files and writes one
  # compressed table, no GPU or meaningful memory needed.
  ablation_aggregate:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1
