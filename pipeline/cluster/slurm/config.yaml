# Snakemake SLURM Profile - Production
# ======================================
# Alpine cluster production configuration
# Usage: snakemake --profile cluster/slurm --configfile config/samples-alpine.yaml
#
# CPU/GPU Toggle Support:
# -----------------------
# The pipeline supports toggling between CPU and GPU training modes via the
# 'use_cpu_training' parameter in config/config.yaml.
#
# GPU Mode (use_cpu_training: false, DEFAULT):
#   - Partition: aa100 / atesting_a100
#   - Resources: 1 GPU, shorter runtime
#   - Best for: production runs, grid search, model comparison
#
# CPU Mode (use_cpu_training: true):
#   - Partition: amilan
#   - Resources: No GPU, longer runtime (4x), more CPUs
#   - Best for: long GPU queues, debugging, small experiments
#
# Note: Resource allocation is conditionally set based on use_cpu_training.
# YAML doesn't support Python conditionals, so we use Snakemake's runtime
# evaluation of config values. See workflow rules for --device flag handling.

executor: slurm
jobs: 200
max-jobs-per-second: 20
latency-wait: 30 
restart-times: 2
rerun-incomplete: true
keep-going: true
printshellcmds: true

# SLURM settings
# No storage provider needed - using shared filesystem directly

# Job naming - use project name, rule name and wildcards for readable job names
# Example: "Snakemake-synthetic-trna-prepare_chunks-ala_synthetic-12345"
# jobname: "Snakemake-{config[project_name]}-{rule}-{wildcards}-{jobid}"
jobname: "leech-{rule}-{wildcards}-{jobid}"

# Default resources
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general
  ntasks: 1
  runtime: 120
  mem_mb: 8000
  cpus_per_task: 8

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # ============================================================================
  # POD5 Processing Rules
  # ============================================================================
  merge_pods:
    runtime: 120
    mem_mb: 16000
    cpus_per_task: 12

  inspect_merged_pod5:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 4

  inspect_sample_pod5s:
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 4

  aggregate_all_inspections:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  # ============================================================================
  # Basecalling and Alignment Rules
  # ============================================================================
  rebasecall:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  align_rebasecalled:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8

  # ============================================================================
  # Data Preparation Rules
  # ============================================================================
  prepare_chunks:
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 8

  merge_chunks_charged:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  merge_chunks_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # ============================================================================
  # Grid Search Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources are dynamically set in workflow/rules/grid_search.smk based on
  # use_cpu_training config parameter. Do NOT set resources here as they will
  # override the dynamic allocation.
  #
  # Dynamic behavior (defined in grid_search.smk):
  #   GPU mode (use_cpu_training: false):
  #     - partition: aa100, runtime: 1440, cpus: 4, gres: gpu:1
  #   CPU mode (use_cpu_training: true):
  #     - partition: amilan, runtime: 5760, cpus: 16, gres: ""
  #
  # grid_search_charged_vs_uncharged: (resources set dynamically in grid_search.smk)
  # grid_search_pairwise_aa: (resources set dynamically in grid_search.smk)

  # grid_search_architecture_charged: (resources set dynamically in compare_models.smk)
  # grid_search_architecture_pairwise: (resources set dynamically in compare_models.smk)

  # ============================================================================
  # Training Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources are dynamically set in workflow/rules/train.smk based on
  # use_cpu_training config parameter. Do NOT set resources here as they will
  # override the dynamic allocation.
  #
  # Dynamic behavior (defined in train.smk):
  #   GPU mode (use_cpu_training: false):
  #     - partition: aa100, runtime: 60, cpus: 10, gres: gpu:1
  #   CPU mode (use_cpu_training: true):
  #     - partition: amilan, runtime: 240, cpus: 16, gres: ""
  #
  # train_charged_vs_uncharged: (resources set dynamically in train.smk)
  # train_pairwise_aa: (resources set dynamically in train.smk)

  # train_architecture_charged: (resources set dynamically in compare_models.smk)
  # train_architecture_pairwise: (resources set dynamically in compare_models.smk)

  # ============================================================================
  # Inference Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources are dynamically set in workflow/rules/inference.smk based on
  # use_cpu_training config parameter. Do NOT set resources here as they will
  # override the dynamic allocation.
  #
  # Dynamic behavior (defined in inference.smk):
  #   GPU mode (use_cpu_training: false):
  #     - partition: aa100, runtime: 240, cpus: 4, gres: gpu:1
  #   CPU mode (use_cpu_training: true):
  #     - partition: amilan, runtime: 960, cpus: 16, gres: ""
  #
  # infer_charged_vs_uncharged: (resources set dynamically in inference.smk)
  # infer_pairwise_aa: (resources set dynamically in inference.smk)

  # ============================================================================
  # Testing/Evaluation Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources are dynamically set in workflow/rules/evaluate.smk based on
  # use_cpu_training config parameter. Do NOT set resources here as they will
  # override the dynamic allocation.
  #
  # Dynamic behavior (defined in evaluate.smk):
  #   GPU mode (use_cpu_training: false):
  #     - partition: atesting_a100, runtime: 60, cpus: 2, gres: gpu:1
  #   CPU mode (use_cpu_training: true):
  #     - partition: amilan, runtime: 240, cpus: 16, gres: ""
  #
  # test_charged_vs_uncharged: (resources set dynamically in evaluate.smk)
  # test_pairwise_aa: (resources set dynamically in evaluate.smk)

  # test_architecture_charged: (resources set dynamically in compare_models.smk)
  # test_architecture_pairwise: (resources set dynamically in compare_models.smk)

  # ============================================================================
  # Comparison and Summary Rules (CPU only)
  # ============================================================================
  compare_architectures_charged:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  compare_architectures_pairwise:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  summarize_charged_vs_uncharged:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  summarize_pairwise:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1
