# ConvLSTM family without attention pooling.
#
#     signal   -> SignalBranch   -> pool -> |
#     sequence -> SequenceBranch ->         +-- cat -> BiLSTM -> centre -> FC
#     features -> FeatureBranch  ->         |   (Dwell variants only)
#
# Four registry names differ only in `has_features` and `norm_type`; both are
# already constructor switches in components.make_norm(), so they no longer
# need a class each.
#
# Node declaration order is also module-construction order, and is chosen to
# match the classes this replaces so that a given torch seed yields identical
# initial weights.

kind = "graph"
inputs = ["signal", "sequence", "features"]
output = "logits"

[params]
signal_len = "${DEFAULT_SIGNAL_LEN}"
kmer_len = "${DEFAULT_KMER_LEN}"
num_features = "${DEFAULT_NUM_FEATURES}"
conv_channels = "${DEFAULT_CONV_CHANNELS}"
lstm_hidden = "${DEFAULT_LSTM_HIDDEN}"
dropout = "${DEFAULT_DROPOUT}"
seq_encoding = "base_onehot"
signal_kmer_context = "${DEFAULT_SIGNAL_KMER_CONTEXT}"
num_out = 1
signal_in_channels = 1

[derived]
seq_in_channels = "${4 * (signal_kmer_context[0] + signal_kmer_context[1] + 1) if seq_encoding == 'signal_kmer' else 4}"
n_branches = "${3 if has_features else 2}"
pooled_seq = "${seq_encoding == 'signal_kmer'}"

# ── branches (declared first: matches original construction order) ─────────

[[nodes]]
name = "signal_branch"
layer = "signalbranch"
inputs = ["signal"]
out = "signal_feat"
[nodes.args]
in_channels = "${signal_in_channels}"
conv_channels = "${conv_channels}"
norm_type = "${norm_type}"

[[nodes]]
name = "sequence_branch"
layer = "sequencebranch"
inputs = ["sequence"]
out = "seq_feat"
[nodes.args]
in_channels = "${seq_in_channels}"
conv_channels = "${conv_channels}"
norm_type = "${norm_type}"

[[nodes]]
name = "feature_branch"
layer = "featurebranch"
when = "${has_features}"
inputs = ["features"]
out = "feat_feat"
[nodes.args]
num_features = "${num_features}"
conv_channels = "${conv_channels}"
norm_type = "${norm_type}"

# ── temporal alignment: every branch must emit kmer_len positions ──────────

[[nodes]]
name = "signal_pool"
layer = "adaptiveavgpool1d"
inputs = ["signal_feat"]
out = "signal_feat"
[nodes.args]
output_size = "${kmer_len}"

[[nodes]]
name = "seq_pool"
layer = "adaptiveavgpool1d"
when = "${pooled_seq}"
inputs = ["seq_feat"]
out = "seq_feat"
[nodes.args]
output_size = "${kmer_len}"

# ── merge + body ──────────────────────────────────────────────────────────

[[nodes]]
name = "merge"
layer = "concat"
inputs = "${['signal_feat', 'seq_feat', 'feat_feat'] if has_features else ['signal_feat', 'seq_feat']}"
out = "merged"
[nodes.args]
dim = 1

[[nodes]]
name = "to_time_major"
layer = "transpose"
inputs = ["merged"]
out = "merged"
[nodes.args]
dim0 = 1
dim1 = 2

[[nodes]]
name = "lstm"
layer = "bilstm"
inputs = ["merged"]
out = "lstm_out"
[nodes.args]
input_size = "${conv_channels[2] * n_branches}"
hidden_size = "${lstm_hidden}"
num_layers = "${DEFAULT_LSTM_LAYERS}"
batch_first = true
bidirectional = true
dropout = "${dropout}"

[[nodes]]
name = "centre"
layer = "index"
inputs = ["lstm_out"]
out = "context"
[nodes.args]
index = "${kmer_len // 2}"
dim = 1

[[nodes]]
name = "fc"
layer = "mlphead"
inputs = ["context"]
out = "logits"
[nodes.args]
in_features = "${lstm_hidden * 2}"
hidden_features = "${DEFAULT_FC_HIDDEN}"
out_features = "${num_out}"
dropout = "${dropout}"

# ── registry names ────────────────────────────────────────────────────────

[[variants]]
name = "ConvLSTMBase"
doc = "Baseline model with signal and sequence branches only."
[variants.params]
has_features = false
norm_type = "none"

[[variants]]
name = "ConvLSTMBaseBN"
doc = "Baseline model with BatchNorm after each Conv1d layer."
[variants.params]
has_features = false
norm_type = "batchnorm"

[[variants]]
name = "ConvLSTMDwell"
doc = "Full model with signal, sequence, and dwell feature branches."
[variants.params]
has_features = true
norm_type = "none"

[[variants]]
name = "ConvLSTMDwellBN"
doc = "Full model with dwell features and BatchNorm."
[variants.params]
has_features = true
norm_type = "batchnorm"
