# Normalisation variants of TCNDwellResidual (2-channel signal: raw + kmer
# residual).  See tcn_dwell_variants.toml for the rationale.

kind = "class"
target = "leech.models.tcn_dwell_residual:TCNDwellResidual"

[params]
signal_len = "${DEFAULT_SIGNAL_LEN}"
kmer_len = "${DEFAULT_KMER_LEN}"
num_features = "${DEFAULT_NUM_FEATURES}"
dwell_margin = "${DEFAULT_DWELL_MARGIN}"
signal_in_channels = 2
hidden_channels = 64
num_layers = 6
kernel_size = 3
num_attn_heads = 4
dropout = "${DEFAULT_DROPOUT}"
seq_encoding = "base_onehot"
signal_kmer_context = "${DEFAULT_SIGNAL_KMER_CONTEXT}"
norm_type = "batchnorm"
num_out = 1

[[variants]]
name = "TCNDwellResidualGN"
doc = "TCNDwellResidual with GroupNorm instead of BatchNorm."
[variants.params]
norm_type = "groupnorm"

[[variants]]
name = "TCNDwellResidualLN"
doc = "TCNDwellResidual with LayerNorm instead of BatchNorm."
[variants.params]
norm_type = "layernorm"
