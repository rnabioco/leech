# TCNDwellResidual with an explicit motor-region pooling pathway.
#
# The feature-branch output at the motor positions (+8..+12 by default) is
# mean-pooled, projected, and concatenated with the attention-pooled context
# vector before the classifier.  That guarantees the model sees motor-region
# dwell even when cross-attention settles on the constriction zone.
#
# These names were referenced by ModelInferenceWrapper.FEATURE_MODELS but were
# never in the model registry until they were declared as configs, so
# get_model() rejected them while the inference path assumed they existed.
#
# `build_order` is needed here: the class this replaces added `motor_proj`
# *after* its parent had already installed `classifier`, so construction order
# (and therefore state_dict key order) is not the dataflow order.

kind = "graph"
inputs = ["signal", "sequence", "features"]
output = "logits"

build_order = [
    "signal_tcn",
    "signal_pool",
    "seq_tcn",
    "seq_pool",
    "feature_branch",
    "feat_to_time_major",
    "merge",
    "to_time_major",
    "cross_attn",
    "attn_residual",
    "attn_norm",
    "pool_linear",
    "attn_pool",
    "motor_pool",
    "motor_merge",
    "classifier",
    "motor_proj",
]

[params]
motor_pool_start = 8
motor_pool_end = 13
motor_proj_dim = 64
signal_len = "${DEFAULT_SIGNAL_LEN}"
kmer_len = "${DEFAULT_KMER_LEN}"
num_features = "${DEFAULT_NUM_FEATURES}"
dwell_margin = "${DEFAULT_DWELL_MARGIN}"
signal_in_channels = 2
hidden_channels = 64
num_layers = 6
kernel_size = 3
num_attn_heads = 4
dropout = "${DEFAULT_DROPOUT}"
seq_encoding = "base_onehot"
signal_kmer_context = "${DEFAULT_SIGNAL_KMER_CONTEXT}"
norm_type = "batchnorm"
num_out = 1

[derived]
seq_in_channels = "${4 * (signal_kmer_context[0] + signal_kmer_context[1] + 1) if seq_encoding == 'signal_kmer' else 4}"
pooled_seq = "${seq_encoding == 'signal_kmer'}"
merged_dim = "${hidden_channels * 2}"
feat_dim = "${DEFAULT_CONV_CHANNELS[-1]}"

# ── branches ──────────────────────────────────────────────────────────────

[[nodes]]
name = "signal_tcn"
layer = "tcn"
inputs = ["signal"]
out = "signal_feat"
[nodes.args]
in_channels = "${signal_in_channels}"
hidden_channels = "${hidden_channels}"
num_layers = "${num_layers}"
kernel_size = "${kernel_size}"
dropout = "${dropout}"
norm_type = "${norm_type}"

[[nodes]]
name = "signal_pool"
layer = "adaptiveavgpool1d"
inputs = ["signal_feat"]
out = "signal_feat"
[nodes.args]
output_size = "${kmer_len}"

[[nodes]]
name = "seq_tcn"
layer = "tcn"
inputs = ["sequence"]
out = "seq_feat"
[nodes.args]
in_channels = "${seq_in_channels}"
hidden_channels = "${hidden_channels}"
num_layers = "${num_layers}"
kernel_size = "${kernel_size}"
dropout = "${dropout}"
norm_type = "${norm_type}"

[[nodes]]
name = "seq_pool"
layer = "adaptiveavgpool1d"
when = "${pooled_seq}"
inputs = ["seq_feat"]
out = "seq_feat"
[nodes.args]
output_size = "${kmer_len}"

[[nodes]]
name = "feature_branch"
layer = "featurebranch"
inputs = ["features"]
out = "feat_out"
[nodes.args]
num_features = "${num_features}"
conv_channels = "${DEFAULT_CONV_CHANNELS}"
norm_type = "${norm_type}"

# ── merge + dwell cross-attention ─────────────────────────────────────────

[[nodes]]
name = "feat_to_time_major"
layer = "transpose"
inputs = ["feat_out"]
out = "feat_kv"
[nodes.args]
dim0 = 1
dim1 = 2

[[nodes]]
name = "merge"
layer = "concat"
inputs = ["signal_feat", "seq_feat"]
out = "merged"
[nodes.args]
dim = 1

[[nodes]]
name = "to_time_major"
layer = "transpose"
inputs = ["merged"]
out = "merged"
[nodes.args]
dim0 = 1
dim1 = 2

[[nodes]]
name = "cross_attn"
layer = "crossattention"
inputs = ["merged", "feat_kv", "feat_kv"]
out = "attn_out"
[nodes.args]
embed_dim = "${merged_dim}"
num_heads = "${num_attn_heads}"
kdim = "${feat_dim}"
vdim = "${feat_dim}"
dropout = "${dropout}"
batch_first = true

[[nodes]]
name = "attn_residual"
layer = "add"
inputs = ["merged", "attn_out"]
out = "combined"

[[nodes]]
name = "attn_norm"
layer = "layernorm"
inputs = ["combined"]
out = "combined"
[nodes.args]
normalized_shape = "${merged_dim}"

[[nodes]]
name = "pool_linear"
layer = "linear"
inputs = ["combined"]
out = "pool_scores"
[nodes.args]
in_features = "${merged_dim}"
out_features = 1

[[nodes]]
name = "attn_pool"
layer = "attentionpool"
inputs = ["pool_scores", "combined"]
out = "context"
[nodes.args]
dim = 1

# ── motor-region pathway (bypasses cross-attention) ───────────────────────

[[nodes]]
name = "motor_pool"
layer = "rangemeanpool"
inputs = ["feat_out"]
out = "motor_pooled"
[nodes.args]
start = "${motor_pool_start}"
stop = "${motor_pool_end}"
dim = 2

[[nodes]]
name = "motor_proj"
layer = "normproj"
inputs = ["motor_pooled"]
out = "motor_vec"
[nodes.args]
in_features = "${feat_dim}"
out_features = "${motor_proj_dim}"
norm_type = "${norm_type}"

[[nodes]]
name = "motor_merge"
layer = "concat"
inputs = ["context", "motor_vec"]
out = "context"
[nodes.args]
dim = 1

[[nodes]]
name = "classifier"
layer = "normmlphead"
inputs = ["context"]
out = "logits"
[nodes.args]
in_features = "${merged_dim + motor_proj_dim}"
hidden_features = [256, 64]
out_features = "${num_out}"
dropout = "${dropout}"
norm_type = "${norm_type}"

# ── registry names ────────────────────────────────────────────────────────

[[variants]]
name = "TCNDwellResidualMotor"
doc = "TCNDwellResidual with explicit motor-region pooling (BatchNorm)."
[variants.params]
norm_type = "batchnorm"

[[variants]]
name = "TCNDwellResidualLNMotor"
doc = "TCNDwellResidual with explicit motor-region pooling (LayerNorm)."
[variants.params]
norm_type = "layernorm"
