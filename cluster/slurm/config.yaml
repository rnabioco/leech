# Snakemake SLURM Profile - Production
# ======================================
# Alpine cluster production configuration
# Usage: snakemake --profile cluster/slurm --configfile config/samples-alpine.yaml

executor: slurm
jobs: 100
max-jobs-per-second: 10
latency-wait: 60
restart-times: 3
rerun-incomplete: true
keep-going: true
printshellcmds: true

# SLURM settings
# No storage provider needed - using shared filesystem directly

# Job naming - use project name, rule name and wildcards for readable job names
# Example: "Snakemake-synthetic-trna-prepare_chunks-ala_synthetic-12345"
jobname: "Snakemake-{config[project_name]}-{rule}-{wildcards}-{jobid}"

# Default resources
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general
  ntasks: 1
  runtime: 120
  mem_mb: 8000
  cpus_per_task: 4

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # POD5 processing
  merge_pods:
    runtime: 120
    mem_mb: 16000
    cpus_per_task: 12

  # GPU rules - basecalling
  rebasecall:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 32000
    cpus_per_task: 8
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # Alignment
  align_rebasecalled:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8

  # Data preparation
  prepare_chunks:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 4

  # GPU rules - grid search
  grid_search_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 32000
    cpus_per_task: 8
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  grid_search_pairwise_aa:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 32000
    cpus_per_task: 8
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # GPU rules - training
  train_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 96000
    cpus_per_task: 8
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  train_pairwise_aa:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 96000
    cpus_per_task: 8
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # GPU rules - inference
  infer_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  infer_pairwise_aa:
    slurm_partition: aa100
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # Testing/evaluation (use testing partition)
  test_charged_vs_uncharged:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  test_pairwise_aa:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"
