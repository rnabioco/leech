# Snakemake SLURM Profile - Production
# ======================================
# Alpine cluster production configuration
# Usage: snakemake --profile cluster/slurm --configfile config/samples-alpine.yaml
#
# CPU/GPU Toggle Support:
# -----------------------
# The pipeline supports toggling between CPU and GPU training modes via the
# 'use_cpu_training' parameter in config/config.yaml.
#
# GPU Mode (use_cpu_training: false, DEFAULT):
#   - Partition: aa100 / atesting_a100
#   - Resources: 1 GPU, shorter runtime
#   - Best for: production runs, grid search, model comparison
#
# CPU Mode (use_cpu_training: true):
#   - Partition: amilan
#   - Resources: No GPU, longer runtime (4x), more CPUs
#   - Best for: long GPU queues, debugging, small experiments
#
# Note: Resource allocation is conditionally set based on use_cpu_training.
# YAML doesn't support Python conditionals, so we use Snakemake's runtime
# evaluation of config values. See workflow rules for --device flag handling.

executor: slurm
jobs: 100
max-jobs-per-second: 10
latency-wait: 60
restart-times: 3
rerun-incomplete: true
keep-going: true
printshellcmds: true

# SLURM settings
# No storage provider needed - using shared filesystem directly

# Job naming - use project name, rule name and wildcards for readable job names
# Example: "Snakemake-synthetic-trna-prepare_chunks-ala_synthetic-12345"
# jobname: "Snakemake-{config[project_name]}-{rule}-{wildcards}-{jobid}"
jobname: "leech-{rule}-{wildcards}-{jobid}"

# Default resources
default-resources:
  slurm_partition: amilan
  slurm_account: amc-general
  ntasks: 1
  runtime: 120
  mem_mb: 8000
  cpus_per_task: 4

# SLURM QoS setting
slurm-qos: normal

# Rule-specific resources
set-resources:
  # ============================================================================
  # POD5 Processing Rules
  # ============================================================================
  merge_pods:
    runtime: 120
    mem_mb: 16000
    cpus_per_task: 12

  inspect_merged_pod5:
    runtime: 30
    mem_mb: 4000
    cpus_per_task: 4

  inspect_sample_pod5s:
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 4

  aggregate_all_inspections:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  # ============================================================================
  # Basecalling and Alignment Rules
  # ============================================================================
  rebasecall:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  align_rebasecalled:
    runtime: 240
    mem_mb: 16000
    cpus_per_task: 8

  # ============================================================================
  # Data Preparation Rules
  # ============================================================================
  prepare_chunks:
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4

  merge_chunks_charged:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  merge_chunks_pairwise:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4

  # ============================================================================
  # Grid Search Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources below are for GPU mode. When use_cpu_training=true:
  #   - partition changes to amilan (no GPU)
  #   - runtime increased 4x
  #   - cpus_per_task increased to 16
  #   - gres/gpu/nodes removed
  grid_search_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  grid_search_pairwise_aa:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  grid_search_architecture_charged:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  grid_search_architecture_pairwise:
    slurm_partition: aa100
    runtime: 1440
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # ============================================================================
  # Training Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources below are for GPU mode. When use_cpu_training=true:
  #   - partition changes to amilan (no GPU)
  #   - runtime increased 4x (60→240, 480→1920)
  #   - cpus_per_task increased to 16
  #   - gres/gpu/nodes removed
  train_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 60
    mem_mb: 36000
    cpus_per_task: 10
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  train_pairwise_aa:
    slurm_partition: aa100
    runtime: 60
    mem_mb: 36000
    cpus_per_task: 10
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  train_architecture_charged:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  train_architecture_pairwise:
    slurm_partition: aa100
    runtime: 480
    mem_mb: 16000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # ============================================================================
  # Inference Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources below are for GPU mode. When use_cpu_training=true:
  #   - partition changes to amilan (no GPU)
  #   - runtime increased 4x (240→960)
  #   - cpus_per_task increased to 16
  #   - gres/gpu/nodes removed
  infer_charged_vs_uncharged:
    slurm_partition: aa100
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  infer_pairwise_aa:
    slurm_partition: aa100
    runtime: 240
    mem_mb: 8000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # ============================================================================
  # Testing/Evaluation Rules (GPU/CPU configurable via use_cpu_training)
  # ============================================================================
  # Note: Resources below are for GPU mode. When use_cpu_training=true:
  #   - partition changes to amilan (no GPU)
  #   - runtime increased 4x (60→240)
  #   - cpus_per_task increased to 16
  #   - gres/gpu/nodes removed
  test_charged_vs_uncharged:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  test_pairwise_aa:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  test_architecture_charged:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  test_architecture_pairwise:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 4000
    cpus_per_task: 2
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # ============================================================================
  # Comparison and Summary Rules (CPU only)
  # ============================================================================
  compare_architectures_charged:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  compare_architectures_pairwise:
    runtime: 10
    mem_mb: 2000
    cpus_per_task: 1

  summarize_charged_vs_uncharged:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1

  summarize_pairwise:
    runtime: 5
    mem_mb: 1000
    cpus_per_task: 1
