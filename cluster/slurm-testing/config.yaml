# Snakemake SLURM Profile - Testing
# ===================================
# Alpine cluster testing configuration (reduced resources, atesting_a100 partition)
# Usage: snakemake --profile cluster/slurm-testing --configfile config/samples-alpine.yaml

executor: slurm
jobs: 10
max-jobs-per-second: 2
latency-wait: 60
restart-times: 3
rerun-incomplete: true
keep-going: true
printshellcmds: true

# SLURM settings
slurm-logdir: logs/slurm
slurm-keep-successful-logs: false
slurm-delete-logfiles-older-than: 10
slurm-qos: testing

# Default resources
default-resources:
  slurm_partition: atesting
  slurm_account: amc-general
  runtime: 60
  mem_mb: 8000
  cpus_per_task: 8

# Rule-specific resources (ALL GPU rules use atesting_a100)
set-resources:
  # POD5 processing (use CPU testing partition)
  merge_pods:
    slurm_partition: atesting
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 12

  inspect_pod5:
    slurm_partition: atesting
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4

  # GPU rules - basecalling (TESTING)
  basecall_with_dorado:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  rebasecall:
    slurm_partition: atesting_a100
    runtime: 60
    mem_mb: 8000
    cpus_per_task: 4
    nodes: 1
    gpu: 0
    tasks_per_gpu: 0
    gres: "gpu:1"

  # Alignment (use CPU testing partition)
  align_rebasecalled:
    slurm_partition: atesting
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 8

  # Data preparation (use CPU testing partition)
  prepare_training_data:
    slurm_partition: atesting
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 8

  # GPU rules - grid search (TESTING)
