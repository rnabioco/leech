[package]
name = "leech_core"
version = "0.3.0"
edition = "2024"

[lib]
name = "leech_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
escapepod-signal = { path = "../escapepod-rs/crates/escapepod-signal" }
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
