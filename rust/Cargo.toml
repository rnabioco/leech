[package]
name = "leech_core"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "_leech_core"

[dependencies]
escapepod-signal = { path = "../escapepod-rs/crates/escapepod-signal" }
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
