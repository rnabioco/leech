[package]
name = "leech_core"
# Tracks `leech`'s version in the root pyproject.toml and must be bumped with
# it -- see `.claude/commands/release.md`. This is the single source: the wheel
# takes it via `dynamic = ["version"]` in rust/pyproject.toml, and the module
# exports it as `leech_core.__version__` via `env!("CARGO_PKG_VERSION")`.
#
# Not semver for this crate; nothing consumes leech_core independently. The
# string's real job is to be a cache key and a staleness check. uv keys its
# archive cache on it, so a version that does not move lets `uv sync` restore a
# compiled extension built from any earlier revision that shared it. It sat at
# 0.3.0 from leech v0.3.1 to v0.6.4 -- ten releases spanning #176, #185, #187,
# #188, #192, #195, #200 and #202 -- and did exactly that, silently reinstating
# pre-#188 chunk behaviour over a current build.
version = "0.12.3"
edition = "2024"

[lib]
name = "leech_core"
crate-type = ["cdylib"]

[features]
default = ["test-utils", "extension-module"]
# Gates the Python-callable `_test_process_read` / `_test_ref_to_signal`
# helpers (see inference_pipeline/inference.rs) that tests/test_rust_python_parity.py
# and tests/test_data_prep.py call directly to compare the Rust pipeline
# against the pure-Python reference (rnabioco/leech#261). On by default and
# left on everywhere, including release.yml's wheel build: `_rust_accel.py`
# imports `_test_process_read` in the same try/except block as every real
# production symbol, so a build without this feature raises ImportError
# before any of them bind and silently disables Rust acceleration for real
# installs. Turning it off requires first splitting that import block; until
# then this feature exists so the symbols are visibly test-only and
# opt-out-able in principle, not to actually ship a stripped build.
test-utils = []
# `extension-module` tells pyo3 this crate will be dlopen'd into an
# already-running Python process, which resolves the CPython C-API symbols
# dynamically at load time -- correct for the real wheel maturin builds
# (which does not pass `--no-default-features`, so it keeps getting this),
# but it also means pyo3 deliberately does NOT link against libpython. A
# standalone `cargo test` binary is a real, self-contained executable, not a
# dlopen'd extension, so it can't resolve `PyGILState_Ensure` /
# `PyUnicode_Type` / etc. and fails to link -- not a code defect, a build
# target mismatch. CI's `cargo test` step runs with `--no-default-features
# --features test-utils` for exactly this reason (rnabioco/leech#258 is the
# first PR whose test code exercised enough of pyo3's runtime API, through
# `escapepod_signal::chunk`, to expose the gap #261 left open).
extension-module = ["pyo3/extension-module"]

[dependencies]
# `abi3-py312` builds one stable-ABI wheel per platform that loads on CPython
# 3.12 and every later 3.x, so a new CPython release does not require a new
# leech release to get a wheel. Keep it in step with `requires-python` in the
# root pyproject.toml. `extension-module` comes from the feature above, not
# hardcoded here, so `cargo test` can turn it off.
pyo3 = { version = "0.28", features = ["abi3-py312"] }
numpy = "0.28"
# Not on crates.io; pulled straight from the public GitHub repo. Pin by tag so
# the build is reproducible — bump the tag to take a new escapepod release.
escapepod-signal = { git = "https://github.com/rnabioco/escapepod-rs", tag = "v0.27.0" }
rayon = "1"

[dev-dependencies]
# Synthetic POD5 fixtures for pod5_cache.rs's directory-input test.
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
