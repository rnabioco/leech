[package]
name = "leech_core"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "_leech_core"

[dependencies]
# Local dev / CI build from the escapepod-rs submodule via `path`; the
# `version` is declared so that once escapepod-signal is published to
# crates.io the `path` can be dropped to build leech_core (and a real PyPI
# sdist) without the private submodule.
escapepod-signal = { path = "../escapepod-rs/crates/escapepod-signal", version = "0.5.1" }
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
