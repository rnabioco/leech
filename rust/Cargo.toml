[package]
name = "leech_core"
version = "0.3.0"
edition = "2024"

[lib]
name = "leech_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
# Not on crates.io; pulled straight from the public GitHub repo. Pin by tag so
# the build is reproducible — bump the tag to take a new escapepod release.
escapepod-signal = { git = "https://github.com/rnabioco/escapepod-rs", tag = "v0.14.0" }
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
