# Leech Pipeline Configuration - ALPINE CLUSTER
# ==============================================
# Optimized for CU Boulder Alpine cluster with strict storage quotas

# ============================================================================
# Output Directories - Alpine Storage Hierarchy
# ============================================================================
# CRITICAL: Use /scratch/alpine for intensive I/O, /projects for permanent storage
# - /scratch/alpine: 10TB, high I/O, 90-day auto-purge, NOT backed up
# - /projects: 250GB, backed up, NO intensive I/O
# - /home: 2GB only (for code/configs)

# Intermediate files (high I/O) → scratch
chunks_dir: "/scratch/alpine/$USER/leech/chunks"

# Final outputs (permanent) → projects
models_dir: "/projects/$USER/leech/models"
inference_dir: "/projects/$USER/leech/inference"
metrics_dir: "/projects/$USER/leech/metrics"

# ============================================================================
# Sample Configuration - Alpine Paths
# ============================================================================
samples:
  # Raw data must be in /projects (permanent, backed up)
  sample_charged_ala_rep1:
    pod5: "/projects/$USER/leech/data/charged/ala/rep1.pod5"
    bam: "/projects/$USER/leech/data/charged/ala/rep1.bam"
    label: "charged"
    amino_acid: "Ala"

  sample_charged_ala_rep2:
    pod5: "/projects/$USER/leech/data/charged/ala/rep2.pod5"
    bam: "/projects/$USER/leech/data/charged/ala/rep2.bam"
    label: "charged"
    amino_acid: "Ala"

  sample_charged_gly_rep1:
    pod5: "/projects/$USER/leech/data/charged/gly/rep1.pod5"
    bam: "/projects/$USER/leech/data/charged/gly/rep1.bam"
    label: "charged"
    amino_acid: "Gly"

  sample_uncharged_ala_rep1:
    pod5: "/projects/$USER/leech/data/uncharged/ala/rep1.pod5"
    bam: "/projects/$USER/leech/data/uncharged/ala/rep1.bam"
    label: "uncharged"
    amino_acid: "Ala"

  sample_uncharged_gly_rep1:
    pod5: "/projects/$USER/leech/data/uncharged/gly/rep1.pod5"
    bam: "/projects/$USER/leech/data/uncharged/gly/rep1.bam"
    label: "uncharged"
    amino_acid: "Gly"

# Amino acids for pairwise classification
amino_acids:
  - "Ala"
  - "Gly"
  - "Val"
  - "Leu"
  - "Ile"
  - "Pro"
  - "Phe"
  - "Trp"
  - "Met"
  - "Ser"
  - "Thr"
  - "Cys"
  - "Asn"
  - "Gln"
  - "Tyr"
  - "Lys"
  - "Arg"
  - "His"
  - "Asp"
  - "Glu"

# ============================================================================
# Data Preparation Parameters
# ============================================================================
motif: "CCA"
motif_offset: 2
kmer_len: 5
chunk_context: [200, 200]
train_split: 0.7
val_split: 0.15

# ============================================================================
# Model Configuration
# ============================================================================
model: "ConvLSTMDwell"
compare_models: false

models_to_compare:
  - "ConvLSTMBase"
  - "ConvLSTMDwell"
  - "TransformerDwell"
  - "ConvOnly"
  - "TCNDwell"
  - "ResNetDwell"

# Training hyperparameters
epochs: 50
batch_size: 128
learning_rate: 0.001
early_stopping_patience: 5

# Inference parameters
infer_batch_size: 256

# ============================================================================
# Grid Search Configuration
# ============================================================================
use_grid_search: false

grid_search:
  learning_rate: [0.0001, 0.001, 0.01]
  batch_size: [64, 128, 256]
  hidden_size: [128, 256, 512]
  num_layers: [1, 2, 3]
  dropout: [0.1, 0.2, 0.3]

grid_search_epochs: 20

# ============================================================================
# Cluster Settings - Alpine
# ============================================================================
cluster:
  # REQUIRED: Set your Alpine allocation account
  account: ""  # e.g., "ucb-general", "ucb123_asc1"

  # Alpine partitions
  default_partition: "amilan"     # CPU-only nodes
  gpu_partition: "aa100"          # NVIDIA A100 GPU nodes

  # QoS settings
  default_qos: "normal"           # Up to 24 hours
  testing_qos: "testing"          # For short test jobs

  # Alpine GPU node specs
  default_ntasks: 42              # For aa100 partition (64-core nodes)

  # Time limits (minutes)
  default_time: 120
  training_time: 480              # 8 hours
  grid_search_time: 1440          # 24 hours
  testing_time: 60                # 1 hour for testing partition

  # Memory defaults (MB)
  default_mem: 8000
  training_mem: 16000

  # Job submission settings
  max_jobs: 100
  latency_wait: 60
