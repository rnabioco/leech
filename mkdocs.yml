  - Architecture:
    - Alternative Architectures: issue-alternative-architectures.md
    - Troubleshooting: troubleshooting.md
  - Architecture Decision Records:
    - Overview: adr/README.md
    - Constants Consolidation: adr/0001-constants-consolidation.md
    - Structured Logging: adr/0002-structured-logging.md
    - Model Component Abstraction: adr/0003-model-component-abstraction.md
    - Inference Wrapper Pattern: adr/0004-inference-wrapper-pattern.md
    - Sequence Encoding Consolidation: adr/0005-sequence-encoding-consolidation.md
  - API Reference:
