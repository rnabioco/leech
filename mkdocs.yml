    - Amino Acid Discrimination: guides/04-AA_DISCRIMINATION_PRIMARY_TASK.md
    - Model Predictions: guides/05-MODEL_PREDICTIONS.md
    - Dwell Feature Strategies: guides/06-DWELL_FEATURE_STRATEGIES.md
