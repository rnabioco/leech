  - Cluster Setup:
    - Alpine (SLURM): setup/ALPINE_SETUP.md
    - Bodhi (LSF): setup/BODHI_SETUP.md
    - SLURM Cheatsheet: SLURM_CHEATSHEET.md
  - Grid Search:
